<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NANE — Le réseau professionnel des talents noirs francophones et germanophones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #21184B;
    --ink-soft: #342A6E;
    --paper: #FFFFFF;
    --paper-dim: #F3F0E8; /* ivoire */
    --brass: #C6A15B; /* doré */
    --brass-bright: #A5843F;
    --wine: #6E2430;
    --line: #E3DDCD;
    --text-on-ink: #FFFFFF;
    --text-on-ink-dim: rgba(255,255,255,0.72);
    --text-on-paper: #211B33;
    --text-on-paper-dim: #6A6380;
    --radius-s: 4px;
    --radius-m: 10px;
    --serif: 'Fraunces', serif;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper-dim);
    color: var(--text-on-paper);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  img, svg { max-width: 100%; display: block; }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  /* ---------- Header ---------- */
  header.site {
    position: sticky; top: 0; z-index: 40;
    top: env(safe-area-inset-top, 0px);
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .nav-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0;
  }
  .brand {
    font-family: var(--serif); font-weight: 600; font-size: 22px;
    letter-spacing: 0.01em; color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .brand .mark { color: var(--brass-bright); }
  .logo-full { height: 30px; margin-right: 10px; width: auto; aspect-ratio: 1156 / 296; flex: none; display: block; }
  .logo-full.logo-foot { height: 32px; }
  .brand { color: #0F0F12; }
  .wordmark { font-family: 'Montserrat', var(--sans); font-weight: 500; letter-spacing: 0.38em; font-size: 0.8em; color: #0F0F12; }
  .lockup-tag { font-family: 'Montserrat', var(--sans); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-on-paper-dim); margin-top: 10px; }
  nav.links { display: flex; align-items: center; gap: 24px; }
  nav.links button.navlink { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px !important; }
  .nav-right { display: flex; align-items: center; gap: 14px; }
  .search-wrap { position: relative; flex: 0 1 300px; min-width: 0; }
  .search-wrap > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-on-paper-dim); pointer-events: none; }
  .search-wrap input { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 10px 12px 10px 38px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper-dim); }
  .search-wrap input:focus { outline: 2px solid var(--ink); background: #fff; }
  .search-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; min-width: 300px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(33,24,75,0.16); z-index: 50; overflow: hidden; }
  .sr-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; background: none; border: none; text-align: left; font: inherit; cursor: pointer; }
  .sr-item:hover { background: var(--paper-dim); }
  .sr-item .pc-avatar { width: 34px; height: 34px; font-size: 13px; }
  .sr-name { font-size: 14px; font-weight: 600; }
  .sr-sub { font-size: 12px; color: var(--text-on-paper-dim); }
  .sr-all { justify-content: center; color: var(--ink); font-size: 13px; font-weight: 600; border-top: 1px solid var(--line); }
  .sr-empty { padding: 14px; font-size: 13px; color: var(--text-on-paper-dim); }
  .who-wrap { position: relative; }
  .who { background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 999px; }
  .who:hover { background: var(--paper-dim); }
  .who::after { content: "▾"; font-size: 11px; }
  .user-menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 230px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(33,24,75,0.16); z-index: 50; overflow: hidden; }
  .user-menu button { display: block; width: 100%; text-align: left; background: none; border: none; font: inherit; font-size: 14px; padding: 12px 16px; cursor: pointer; color: var(--text-on-paper); }
  .user-menu button:hover { background: var(--paper-dim); }
  .um-head { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .um-name { font-weight: 600; color: var(--ink); }
  nav.links button.navlink {
    background: none; border: none; color: var(--text-on-paper-dim);
    font-size: 15px; padding: 6px 0; border-bottom: 2px solid transparent;
  }
  nav.links button.navlink:hover { color: var(--text-on-paper); }
  nav.links button.navlink.active { color: var(--ink); border-bottom-color: var(--ink); }
  .lang-toggle {
    display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden;
  }
  .lang-toggle button {
    background: none; border: none; color: var(--text-on-paper-dim);
    font-size: 13px; padding: 6px 13px;
  }
  .lang-toggle button.active { background: var(--ink); color: var(--text-on-ink); font-weight: 600; }
  .who {
    display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-on-paper-dim);
  }
  .who img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 24px; border-radius: var(--radius-s); border: 1px solid transparent;
    font-size: 15px; font-weight: 600; font-family: var(--sans);
  }
  .btn-primary { background: var(--ink); color: var(--text-on-ink); }
  .btn-primary:hover { background: var(--ink-soft); }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--text-on-paper); }
  .btn-ghost:hover { border-color: var(--ink); }
  .btn-wine { background: var(--wine); color: var(--text-on-ink); }
  .btn-wine:hover { background: #7E2A37; }
  .btn-small { padding: 9px 16px; font-size: 13px; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  /* ---------- Hero ---------- */
  section.hero { padding: 88px 0 72px; position: relative; overflow: hidden; }
  .hero-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 40px; align-items: center; }
  .hero h1 {
    font-family: var(--serif); font-weight: 500; font-size: 56px; line-height: 1.07;
    margin: 0 0 24px; letter-spacing: -0.01em; color: var(--ink);
  }
  .hero p.lead {
    font-size: 19px; color: var(--text-on-paper-dim); max-width: 46ch; margin: 0 0 34px;
  }
  .tagline { font-family: var(--serif); font-size: 22px; color: var(--ink); margin: 0 0 12px; }
  .hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; }
  .network-art { width: 100%; height: auto; }

  /* ---------- Value props ---------- */
  section.values { background: var(--paper-dim); color: var(--text-on-paper); padding: 72px 0; }
  .values h2 { font-family: var(--serif); font-weight: 500; font-size: 32px; margin: 0 0 40px; max-width: 30ch; color: var(--ink); }
  .value-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .value-card h3 { font-size: 18px; margin: 0 0 10px; font-weight: 600; }
  .value-card p { font-size: 15px; color: var(--text-on-paper-dim); margin: 0; }
  .value-card { border-top: 2px solid var(--brass); padding-top: 18px; }

  .legal { padding: 56px 0 72px; background: var(--paper-dim); border-top: 1px solid var(--line); }
  .legal h2 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 0 0 14px; color: var(--ink); }
  .legal h3 { font-size: 16px; margin: 26px 0 8px; color: var(--ink); }
  .legal ul { margin: 0; padding-left: 20px; font-size: 15px; color: var(--text-on-paper-dim); }
  .legal li { margin-bottom: 6px; }
  .legal .draft { font-size: 13px; color: var(--wine); margin-top: 18px; }
  .report-link { background: none; border: none; font: inherit; font-size: 12px; color: var(--text-on-paper-dim); text-decoration: underline; cursor: pointer; padding: 0; margin-left: auto; }
  .post-top .report-link { align-self: flex-start; }
  .report-form label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  .report-form select, .report-form textarea { width: 100%; font: inherit; font-size: 14px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .report-form textarea { min-height: 80px; }
  .danger-zone { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); }
  .danger-zone p { font-size: 13px; color: var(--text-on-paper-dim); margin: 0 0 10px; }
  .btn-danger { background: #fff; color: var(--wine); border: 1px solid var(--wine); }

  .public-actions { display: none; gap: 10px; align-items: center; }
  body.public .public-actions { display: flex; }
  body.public .search-wrap, body.public nav.links, body.public .who-wrap { display: none; }
  body.public .nav-right { margin-left: auto; }
  .examples { padding: 8px 0 56px; background: var(--paper-dim); }
  .ex-label { font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-on-paper-dim); padding: 36px 0 16px; }
  .ex-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .ex-card { position: relative; display: flex; gap: 14px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m); padding: 18px; }
  .ex-card .pc-avatar { width: 52px; height: 52px; }
  .ex-card .tag { display: inline-block; margin-top: 8px; }
  .ex-tag { position: absolute; top: 12px; right: 12px; font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px dashed var(--text-on-paper-dim); color: var(--text-on-paper-dim); border-radius: 6px; padding: 3px 7px; }
  @media (max-width: 860px) { .ex-grid { grid-template-columns: 1fr; } }
  .role-banner { background: rgba(110,36,48,0.08); border-bottom: 1px solid var(--wine); color: var(--wine); font-size: 14px; padding: 10px 16px; text-align: center; }
  .dot { position: absolute; top: -4px; right: -2px; min-width: 16px; height: 16px; border-radius: 8px; background: #C9302C; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
  .net-title { font-family: var(--serif); font-weight: 500; font-size: 30px; color: var(--ink); margin: 0 0 18px; }
  .net-stats { display: flex; gap: 28px; margin-bottom: 8px; font-size: 13px; color: var(--text-on-paper-dim); }
  .net-stats b { display: block; font-size: 24px; font-family: var(--serif); color: var(--ink); }
  .net-h { font-size: 16px; margin: 28px 0 10px; color: var(--ink); }
  .net-row { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m); padding: 14px 16px; margin-bottom: 10px; }
  .net-info { flex: 1; min-width: 0; }
  .net-name { background: none; border: none; padding: 0; font: inherit; font-weight: 600; font-size: 15px; color: var(--text-on-paper); cursor: pointer; text-align: left; }
  .net-name:hover { text-decoration: underline; }
  .net-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .net-empty, .net-note { font-size: 13px; color: var(--text-on-paper-dim); margin: 0 0 8px; }
  @media (max-width: 560px) { .net-row { flex-wrap: wrap; } .net-actions { width: 100%; justify-content: flex-start; } }
  .notif-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .notif-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; font: inherit; font-size: 14px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m); padding: 14px 16px; margin-bottom: 8px; cursor: pointer; }
  .notif-row.unread { background: rgba(33,24,75,0.06); border-color: rgba(33,24,75,0.25); }
  .notif-row:hover { border-color: var(--ink); }
  .notif-text { flex: 1; min-width: 0; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .badge.b-mail { color: var(--ink); border-color: var(--ink); background: rgba(33,24,75,0.06); }
  .badge.b-pro { color: #7A6420; border-color: var(--brass); background: rgba(198,161,91,0.18); }
  .badge.b-ref { color: var(--wine); border-color: var(--wine); background: rgba(110,36,48,0.07); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .signup { padding: 48px 0 96px; }
  .signup-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m); padding: 28px; }
  .signup-card h2 { font-family: var(--serif); font-weight: 500; font-size: 28px; margin: 0 0 6px; color: var(--ink); }
  .signup-card .sub { font-size: 14px; color: var(--text-on-paper-dim); margin: 0 0 20px; }
  .mock-banner { background: rgba(198,161,91,0.18); border: 1px solid var(--brass); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 18px; }
  .su-field { margin-bottom: 14px; }
  .su-field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .su-field .hint { font-weight: 400; color: var(--text-on-paper-dim); }
  .su-field input[type=text], .su-field input[type=email] { width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--radius-s); }
  .su-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .su-steps { display: flex; gap: 8px; margin-bottom: 22px; font-size: 12px; color: var(--text-on-paper-dim); }
  .su-steps span { flex: 1; padding-top: 8px; border-top: 3px solid var(--line); }
  .su-steps span.on { border-top-color: var(--ink); color: var(--ink); font-weight: 600; }
  .su-legend { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
  .su-legend div { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-on-paper-dim); }
  .su-sample { display: flex; align-items: center; gap: 14px; margin: 18px 0; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-dim); }
  .su-check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin: 6px 0 18px; }

  /* ---------- Directory ---------- */
  section.directory { padding: 72px 0 96px; background: var(--paper-dim); }
  .dir-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }
  .dir-head h2 { font-family: var(--serif); font-weight: 500; font-size: 30px; margin: 0; color: var(--ink); }
  .dir-count { font-size: 14px; color: var(--text-on-paper-dim); margin-top: 6px; }

  .filters {
    display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 30px;
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m);
    padding: 16px;
  }
  .filters input, .filters select {
    background: #fff; border: 1px solid var(--line); color: var(--text-on-paper);
    border-radius: var(--radius-s); padding: 10px 12px; font-size: 14px; font-family: var(--sans);
  }
  .filters input::placeholder { color: var(--text-on-paper-dim); }
  .filters input[type="text"] { flex: 1 1 220px; min-width: 180px; }
  .filters select { flex: 0 0 auto; }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .profile-card {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m);
    padding: 22px; cursor: pointer; transition: border-color 0.15s ease, box-shadow 0.15s ease;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 1px 2px rgba(33,24,75,0.05);
  }
  .profile-card:hover { border-color: var(--ink); box-shadow: 0 4px 14px rgba(33,24,75,0.10); }
  .pc-top { display: flex; align-items: center; gap: 12px; }
  .pc-avatar {
    width: 44px; height: 44px; border-radius: 50%; background: var(--ink);
    color: var(--text-on-ink); display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-weight: 600; font-size: 16px; flex: none;
  }
  .pc-avatar.has-photo, .modal-avatar.has-photo { background-size: cover; background-position: center; color: transparent; font-size: 0; }
  .photo-field { display: flex; align-items: center; gap: 16px; }
  .photo-preview { width: 84px; height: 84px; border-radius: 50%; background: var(--ink) center/cover no-repeat; color: var(--text-on-ink); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 600; font-size: 28px; flex: none; }
  .photo-preview.has-photo { font-size: 0; }
  .photo-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .photo-actions button { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; }
  .photo-actions button.link { border: none; padding: 0; text-decoration: underline; color: var(--text-on-paper-dim); }
  .pc-name { font-weight: 600; font-size: 16px; }
  .pc-title { font-size: 13px; color: var(--text-on-paper-dim); }
  .pc-loc { font-size: 13px; color: var(--text-on-paper-dim); }
  .pc-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .tag {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: rgba(33,24,75,0.07); color: var(--ink); border: 1px solid rgba(33,24,75,0.18);
  }
  .pc-snippet { font-size: 13px; color: var(--text-on-paper-dim); margin-top: 4px; }
  .pc-snippet b { color: var(--text-on-paper); font-weight: 600; }

  .empty-state {
    text-align: center; padding: 56px 20px; border: 1px dashed var(--line); border-radius: var(--radius-m);
    color: var(--text-on-paper-dim);
  }
  .empty-state h3 { font-family: var(--serif); font-weight: 500; font-size: 22px; color: var(--ink); margin: 0 0 8px; }

  /* ---------- Feed ---------- */
  .wrap-narrow { max-width: 640px; }
  .feed-section { padding: 48px 0 96px; }
  .composer {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m);
    padding: 18px; margin-bottom: 28px;
  }
  .composer textarea {
    width: 100%; min-height: 70px; resize: vertical; font-family: var(--sans); font-size: 15px;
    border: 1px solid var(--line); border-radius: var(--radius-s); padding: 11px 13px; color: var(--text-on-paper);
    background: #fff;
  }
  .composer-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 12px; }
  .feed-grid { display: grid; grid-template-columns: 250px minmax(0, 640px); gap: 24px; justify-content: center; align-items: start; }
  .side-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m); overflow: hidden; position: sticky; top: 90px; }
  .sp-cover { height: 64px; background: linear-gradient(120deg, var(--ink), var(--ink-soft)); }
  .sp-avatar { border-radius: 50%; background-color: var(--ink); background-size: cover; background-position: center; background-repeat: no-repeat; color: var(--text-on-ink); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 600; flex: none; position: relative; }
  .sp-avatar.has-photo { font-size: 0 !important; }
  .sp-avatar { width: 72px !important; height: 72px !important; font-size: 24px !important; margin: -36px 0 0 18px; border: 3px solid #fff; box-sizing: border-box; }
  .sp-body { padding: 10px 18px 18px; }
  .sp-name { font-family: var(--serif); font-size: 19px; font-weight: 500; color: var(--ink); }
  .sp-title { font-size: 13px; color: var(--text-on-paper); margin-top: 2px; }
  .sp-loc { font-size: 12px; color: var(--text-on-paper-dim); margin: 4px 0 14px; }
  .composer-img { margin-top: 10px; }
  .composer-img img { max-width: 100%; max-height: 220px; border-radius: 8px; display: block; margin-bottom: 4px; }
  .post-img { max-width: 100%; border-radius: 8px; margin-top: 12px; display: block; }
  .repost-box { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 10px; background: var(--paper-dim); }
  .post-counts { font-size: 12px; color: var(--text-on-paper-dim); margin-top: 12px; min-height: 4px; }
  .post-actions { display: flex; gap: 4px; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
  .post-actions button { flex: 1; background: none; border: none; font: inherit; font-size: 13px; color: var(--text-on-paper-dim); padding: 9px 6px; border-radius: 8px; cursor: pointer; }
  .post-actions button:hover { background: var(--paper-dim); }
  .post-actions button.on { color: var(--wine); font-weight: 600; }
  .comments { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
  .cm { display: flex; gap: 10px; margin-bottom: 10px; }
  .cm .cm-av { width: 30px; height: 30px; font-size: 11px; }
  .cm-body { background: var(--paper-dim); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .cm-new { display: flex; gap: 8px; }
  .cm-new input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; }
  .post-card {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m);
    padding: 20px; margin-bottom: 14px;
  }
  .post-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .post-meta-name { font-weight: 600; font-size: 15px; }
  .post-meta-time { font-size: 12px; color: var(--text-on-paper-dim); }
  .post-text { font-size: 14px; color: var(--text-on-paper); white-space: pre-line; line-height: 1.6; }

  /* ---------- Messages ---------- */
  .new-convo { display: flex; gap: 10px; margin-bottom: 20px; }
  .new-convo select {
    flex: 1 1 auto; background: #fff; border: 1px solid var(--line); color: var(--text-on-paper);
    border-radius: var(--radius-s); padding: 10px 12px; font-size: 14px; font-family: var(--sans);
  }
  .messages-layout {
    display: grid; grid-template-columns: 260px 1fr; gap: 18px; min-height: 420px;
    border: 1px solid var(--line); border-radius: var(--radius-m); overflow: hidden;
  }
  .thread-list { border-right: 1px solid var(--line); background: var(--paper-dim); overflow-y: auto; max-height: 520px; }
  .thread-item {
    padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; flex-direction: column; gap: 3px;
  }
  .thread-item:hover { background: rgba(33,24,75,0.04); }
  .thread-item.active { background: rgba(33,24,75,0.08); }
  .thread-item .t-name { font-weight: 600; font-size: 14px; }
  .thread-item .t-snippet { font-size: 12px; color: var(--text-on-paper-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread-view { display: flex; flex-direction: column; padding: 0; }
  .thread-header { padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 15px; }
  .thread-messages { flex: 1 1 auto; padding: 18px 20px; overflow-y: auto; max-height: 420px; display: flex; flex-direction: column; gap: 10px; }
  .msg-bubble { max-width: 70%; padding: 9px 13px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
  .msg-bubble.mine { align-self: flex-end; background: var(--ink); color: var(--text-on-ink); }
  .msg-bubble.theirs { align-self: flex-start; background: var(--paper-dim); color: var(--text-on-paper); }
  .thread-input-row { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }
  .thread-input-row input {
    flex: 1 1 auto; border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px 13px;
    font-size: 14px; font-family: var(--sans); color: var(--text-on-paper);
  }
  .messages-empty { padding: 60px 20px; text-align: center; color: var(--text-on-paper-dim); font-size: 14px; }

  @media (max-width: 760px) {
    .messages-layout { grid-template-columns: 1fr; }
    .thread-list { max-height: 200px; border-right: none; border-bottom: 1px solid var(--line); }
  }

  /* ---------- Profile form ---------- */
  section.form-section { background: var(--paper-dim); color: var(--text-on-paper); padding: 72px 0 90px; }
  .form-head { max-width: 56ch; margin-bottom: 36px; }
  .form-head h2 { font-family: var(--serif); font-weight: 500; font-size: 30px; margin: 0 0 10px; color: var(--ink); }
  .form-head p { color: var(--text-on-paper-dim); font-size: 15px; margin: 0; }

  form#profileForm { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 13px; font-weight: 600; color: var(--text-on-paper); }
  .field .hint { font-size: 12px; color: var(--text-on-paper-dim); margin-top: -2px; }
  .field input, .field select, .field textarea {
    font-family: var(--sans); font-size: 15px; padding: 11px 13px;
    border: 1px solid var(--line); border-radius: var(--radius-s); background: #fff; color: var(--text-on-paper);
  }
  .field textarea { resize: vertical; min-height: 78px; }
  .checks { display: flex; gap: 16px; flex-wrap: wrap; }
  .checks label { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 400; color: var(--text-on-paper); }
  .form-actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; margin-top: 8px; }
  .save-msg { font-size: 14px; color: #3E7A4C; }
  .gate-msg {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m); padding: 24px;
    font-size: 15px; color: var(--text-on-paper-dim);
  }

  @media (max-width: 760px) {
    form#profileForm { grid-template-columns: 1fr; }
  }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(33,24,75,0.45); z-index: 100;
    display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 60px 20px;
  }
  .modal {
    background: #fff; color: var(--text-on-paper); border-radius: var(--radius-m);
    max-width: 560px; width: 100%; padding: 36px; position: relative;
    box-shadow: 0 20px 60px rgba(33,24,75,0.25);
  }
  .modal-close {
    position: absolute; top: 18px; right: 18px; background: none; border: none;
    font-size: 22px; color: var(--text-on-paper-dim); line-height: 1; padding: 4px;
  }
  .modal-top { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
  .modal-avatar {
    width: 58px; height: 58px; border-radius: 50%; background: var(--ink);
    color: var(--text-on-ink); display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-weight: 600; font-size: 20px; flex: none;
  }
  .modal h3 { font-family: var(--serif); font-weight: 500; font-size: 24px; margin: 0 0 4px; color: var(--ink); }
  .modal .modal-sub { font-size: 14px; color: var(--text-on-paper-dim); }
  .modal-block { margin-top: 20px; }
  .modal-block h4 { font-size: 13px; font-weight: 600; text-transform: none; margin: 0 0 6px; color: var(--text-on-paper); }
  .modal-block p { font-size: 14px; color: var(--text-on-paper-dim); margin: 0; white-space: pre-line; }

  /* ---------- Footer ---------- */
  footer { padding: 36px 0; border-top: 1px solid var(--line); }
  footer .wrap { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
  footer { background: var(--paper-dim); }
  .foot-links { display: grid; grid-template-columns: repeat(2, auto); gap: 10px 40px; }
  .foot-links a { font-size: 14px; color: var(--text-on-paper-dim); text-decoration: none; }
  .foot-links a:hover { color: var(--ink); text-decoration: underline; }
  footer .foot-bottom { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); align-items: center; font-size: 13px; color: var(--text-on-paper-dim); }
  footer p { font-size: 13px; color: var(--text-on-paper-dim); margin: 0; }

  section[data-view] { display: none; }
  section[data-view].active { display: block; }

  @media (max-width: 860px) {
    .feed-grid { grid-template-columns: 1fr; }
    .side-card { position: static; }
    .hero-grid { grid-template-columns: 1fr; }
    .network-art { display: none; }
    .hero h1 { font-size: 40px; }
    .value-grid { grid-template-columns: 1fr; }
    .nav-row { flex-wrap: wrap; row-gap: 8px; padding: 12px 0 0; }
    .brand { order: 1; } .nav-right { order: 2; margin-left: auto; }
    .search-wrap { order: 3; flex: 1 1 100%; }

    nav.links {
      order: 4; width: 100%; gap: 22px; justify-content: space-around; overflow-x: auto; padding: 0 0 2px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    nav.links::-webkit-scrollbar { display: none; }
    nav.links button.navlink { white-space: nowrap; flex: none; }
  }
</style>

    function norm(x) { return (x || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
    function run() {
      var q = norm(inp.value.trim());
      if (!q) { box.hidden = true; return; }
      var hits = allProfiles.filter(function (p) {
        return norm([p.name, p.title, p.city, p.country, p.sector, (p.skills || []).join(" ")].join(" ")).indexOf(q) !== -1;
      });

  // ---------- network (connections) ----------
  var myConns = [];
  function pairId(a, b) { return [a, b].sort().join("_"); }
  function profileById(id) {
    for (var i = 0; i < allProfiles.length; i++) if (allProfiles[i].__id === id) return allProfiles[i];
    return null;
  }
  function connFor(id) {
    for (var i = 0; i < myConns.length; i++) if (myConns[i].participantIds.indexOf(id) !== -1) return myConns[i];
    return null;
  }
  function connState(id) {
    var c = connFor(id);
    if (!c) return "none";
    if (c.status === "accepted") return "connected";
    return c.requesterId === selfId ? "sent" : "received";
  }
  function connAct(id, act) {
    if (!dbNs || !selfId || !id) return Promise.resolve();
    var ref = dbNs.collection("connections").doc(pairId(selfId, id));
    if (act === "invite") { notify(id, "invite"); return ref.set({ participantIds: [selfId, id], requesterId: selfId, status: "pending", createdAt: Date.now() }); }
    if (act === "accept") { notify(id, "accepted"); return ref.update({ status: "accepted", acceptedAt: Date.now() }); }
    return ref.delete();
  }
  function connLabel(st) {
    return { none: T("Se connecter", "Vernetzen", "Connect"), sent: T("Invitation envoyée", "Einladung gesendet", "Invitation sent"),
      received: T("Accepter l'invitation", "Einladung annehmen", "Accept invitation"), connected: T("Dans ton réseau ✓", "In deinem Netzwerk ✓", "In your network ✓") }[st];
  }
  function updateNetDot() {
    var n = myConns.filter(function (c) { return c.status === "pending" && c.requesterId !== selfId; }).length;
    var d = document.getElementById("netDot"); if (d) { d.textContent = n; d.style.display = n ? "" : "none"; }
  }
  function suggestions() {
    var me = lastProfileData || {};
    return allProfiles.filter(function (p) { return p.__id !== selfId && connState(p.__id) === "none"; }).map(function (p) {
      var sc = 0;
      if (me.sector && p.sector === me.sector) sc += 2;
      if (me.city && p.city && p.city.toLowerCase() === me.city.toLowerCase()) sc += 2;
      if (me.country && p.country === me.country) sc += 1;
      (p.languages || []).forEach(function (l) { if ((me.languages || []).indexOf(l) !== -1) sc += 1; });
      (p.skills || []).forEach(function (k) { if ((me.skills || []).map(function (x) { return x.toLowerCase(); }).indexOf(k.toLowerCase()) !== -1) sc += 1; });
      return { p: p, sc: sc };
    }).sort(function (a, b) { return b.sc - a.sc; }).slice(0, 8).map(function (x) { return x.p; });
  }
  function netRow(p, actions) {
    return '<div class="net-row">' + avatarHtml("pc-avatar", p.name, p.photo) +
      '<div class="net-info"><button class="net-name" data-act="view" data-id="' + p.__id + '">' + escapeHtml(p.name) + '</button>' +
      '<div class="pc-title">' + escapeHtml(p.title || "") + '</div>' +
      '<div class="pc-loc">' + escapeHtml([p.city, p.country].filter(Boolean).join(", ")) + '</div></div>' +
      '<div class="net-actions">' + actions + '</div></div>';
  }
  function btn(act, id, label, cls) { return '<button class="btn ' + (cls || "btn-ghost") + ' btn-small" data-act="' + act + '" data-id="' + id + '">' + escapeHtml(label) + '</button>'; }
  function renderNetwork() {
    updateNetDot();
    var el = document.getElementById("netBody"); if (!el) return;
    if (!selfId) { el.innerHTML = '<div class="gate-msg">' + escapeHtml(t("connectToCreate")) + '</div>'; return; }
    var recv = [], sent = [], conn = [];
    myConns.forEach(function (c) {
      var id = c.participantIds[0] === selfId ? c.participantIds[1] : c.participantIds[0], p = profileById(id);
      if (!p) return;
      if (c.status === "accepted") conn.push(p); else if (c.requesterId === selfId) sent.push(p); else recv.push(p);
    });
    var h = '<div class="net-stats"><div><b>' + conn.length + '</b>' + escapeHtml(T("relations", "Kontakte", "connections")) + '</div>' +
      '<div><b>' + recv.length + '</b>' + escapeHtml(T("invitations reçues", "erhaltene Einladungen", "invitations received")) + '</div>' +
      '<div><b>' + sent.length + '</b>' + escapeHtml(T("envoyées", "gesendet", "sent")) + '</div></div>';
    if (recv.length) h += '<h3 class="net-h">' + escapeHtml(T("Invitations reçues", "Erhaltene Einladungen", "Invitations received")) + '</h3>' +
      recv.map(function (p) { return netRow(p, btn("accept", p.__id, T("Accepter", "Annehmen", "Accept"), "btn-primary") + btn("remove", p.__id, T("Ignorer", "Ablehnen", "Ignore"))); }).join("");
    h += '<h3 class="net-h">' + escapeHtml(T("Mes relations", "Meine Kontakte", "My connections")) + '</h3>' +
      (conn.length ? conn.map(function (p) { return netRow(p, btn("msg", p.__id, T("Message", "Nachricht", "Message"), "btn-primary") + btn("remove", p.__id, T("Retirer", "Entfernen", "Remove"))); }).join("")
        : '<p class="net-empty">' + escapeHtml(T("Pas encore de relation. Invite des personnes ci-dessous ou depuis l'annuaire.", "Noch keine Kontakte. Lade unten oder im Verzeichnis Personen ein.", "No connections yet. Invite people below or from the directory.")) + '</p>');
    if (sent.length) h += '<h3 class="net-h">' + escapeHtml(T("Invitations envoyées", "Gesendete Einladungen", "Invitations sent")) + '</h3>' +
      sent.map(function (p) { return netRow(p, btn("remove", p.__id, T("Annuler", "Zurückziehen", "Withdraw"))); }).join("");
    var sg = suggestions();
    h += '<h3 class="net-h">' + escapeHtml(T("Personnes que tu pourrais connaître", "Personen, die du kennen könntest", "People you may know")) + '</h3>' +
      (sg.length ? sg.map(function (p) { return netRow(p, btn("invite", p.__id, T("Se connecter", "Vernetzen", "Connect"), "btn-primary")); }).join("")
        : '<p class="net-empty">' + escapeHtml(T("Aucune suggestion pour l'instant. Elles apparaissent quand d'autres membres rejoignent le réseau.", "Noch keine Vorschläge. Sie erscheinen, sobald weitere Mitglieder beitreten.", "No suggestions yet. They appear as more members join.")) + '</p>');
    h += '<p class="net-note">' + escapeHtml(T("Suggestions basées sur le secteur, la ville, les langues et les compétences en commun.", "Vorschläge basieren auf gemeinsamer Branche, Stadt, Sprachen und Fähigkeiten.", "Suggestions are based on shared sector, city, languages and skills.")) + '</p>';
    el.innerHTML = h;
    el.querySelectorAll("[data-act]").forEach(function (b) {
      b.addEventListener("click", function () {
        var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), p = profileById(id);
        if (act === "view") { if (p) openModal(p); }
        else if (act === "msg") { showView("messages"); openThreadWith(id, p ? p.name : ""); }
        else { b.disabled = true; connAct(id, act); }
      });
    });
  }

  // ---------- notifications ----------
  var myNotifs = [];
  function notify(toId, type, extra) {
    if (!dbNs || !selfId || !toId || toId === selfId) return;
    var d = { toId: toId, fromId: selfId, fromName: myName(), type: type, read: false, createdAt: Date.now() };
    for (var k in (extra || {})) d[k] = extra[k];
    dbNs.collection("notifications").add(d);
  }
  function notifText(n) {
    var who = n.fromName || T("Quelqu'un", "Jemand", "Someone");
    var sn = n.snippet ? ' : « ' + n.snippet.slice(0, 80) + (n.snippet.length > 80 ? "…" : "") + ' »' : "";
    return {
      like: who + T(" a aimé ta publication", " gefällt dein Beitrag", " liked your post") + sn,
      comment: who + T(" a commenté ta publication", " hat deinen Beitrag kommentiert", " commented on your post") + sn,
      repost: who + T(" a republié ta publication", " hat deinen Beitrag geteilt", " reposted your post") + sn,
      invite: who + T(" t'a envoyé une invitation", " hat dir eine Einladung gesendet", " sent you an invitation"),
      accepted: who + T(" a accepté ton invitation", " hat deine Einladung angenommen", " accepted your invitation"),
      message: who + T(" t'a envoyé un message", " hat dir eine Nachricht gesendet", " sent you a message") + sn
    }[n.type] || who;
  }
  function timeAgo(ts) {
    var m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return T("à l'instant", "gerade eben", "just now");
    if (m < 60) return m + " min";
    var h = Math.round(m / 60);
    if (h < 24) return h + " h";
    return Math.round(h / 24) + T(" j", " T", " d");
  }
  function updateNotifDot() {
    var n = myNotifs.filter(function (x) { return !x.read; }).length;
    var d = document.getElementById("notifDot"); if (d) { d.textContent = n; d.style.display = n ? "" : "none"; }
  }
  function markRead(ids) {
    ids.forEach(function (id) { dbNs.collection("notifications").doc(id).update({ read: true }); });
  }
  function renderNotifs() {
    updateNotifDot();
    var el = document.getElementById("notifBody"); if (!el) return;
    if (!selfId) { el.innerHTML = '<div class="gate-msg">' + escapeHtml(t("connectToCreate")) + '</div>'; return; }
    var unread = myNotifs.filter(function (n) { return !n.read; });
    var h = '<div class="notif-head"><span class="net-note">' + escapeHtml(unread.length ? unread.length + T(" non lue(s)", " ungelesen", " unread") : T("Tout est lu", "Alles gelesen", "All caught up")) + '</span>' +
      (unread.length ? '<button class="btn btn-ghost btn-small" id="notifAll">' + escapeHtml(T("Tout marquer comme lu", "Alle als gelesen markieren", "Mark all as read")) + '</button>' : '') + '</div>';
    h += myNotifs.length ? myNotifs.map(function (n) {
      return '<button class="notif-row' + (n.read ? '' : ' unread') + '" data-id="' + n.__id + '">' + avatarHtml("pc-avatar", n.fromName, photoOf(n.fromId)) +
        '<div class="notif-text">' + escapeHtml(notifText(n)) + '<div class="pc-loc">' + escapeHtml(timeAgo(n.createdAt)) + '</div></div></button>';
    }).join("") : '<div class="empty-state"><h3>' + escapeHtml(T("Aucune notification", "Keine Benachrichtigungen", "No notifications")) + '</h3><p>' +
      escapeHtml(T("Tu seras prévenue ici des likes, commentaires, invitations et messages.", "Hier erscheinen Likes, Kommentare, Einladungen und Nachrichten.", "Likes, comments, invitations and messages will show up here.")) + '</p></div>';
    el.innerHTML = h;
    var all = document.getElementById("notifAll");
    if (all) all.addEventListener("click", function () { markRead(unread.map(function (n) { return n.__id; })); });
    el.querySelectorAll(".notif-row").forEach(function (b) {
      b.addEventListener("click", function () {
        var n = myNotifs.filter(function (x) { return x.__id === b.getAttribute("data-id"); })[0]; if (!n) return;
        if (!n.read) markRead([n.__id]);
        if (n.type === "invite" || n.type === "accepted") showView("network");

        else showView("feed");
      });
    });
  }

  function resizeImage(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var k = Math.min(1, maxSide / Math.max(img.width, img.height)), q = quality, out = "";
        for (var tries = 0; tries < 5; tries++) {
          var c = document.createElement("canvas");
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL("image/jpeg", q);
          if (out.length < 170000) break;
          q = Math.max(0.5, q - 0.1); k = k * 0.85;
        }
        URL.revokeObjectURL(url);
        out.length < 200000 ? resolve(out) : reject(new Error("too big"));
      };
      img.onerror = function () { reject(new Error("image")); };
      img.src = url;
    });
  }

      el.classList.toggle("active", el.getAttribute("data-convo") === convoId);
    });
    var view = document.getElementById("threadView");
    view.innerHTML =
      '<div class="thread-header">' + escapeHtml(otherName || "") + '</div>' +
      '<div class="thread-messages" id="threadMessages"></div>' +
      '<div class="thread-input-row"><input type="text" id="msgInput" placeholder="' + escapeHtml(t("messagePlaceholder")) + '">' +
      '<button class="btn btn-primary btn-small" id="msgSendBtn">' + escapeHtml(t("sendBtn")) + '</button></div>';
    currentThreadUnsub = dbNs.collection("messages/" + convoId + "/items").orderBy("createdAt", "asc").limit(300).onSnapshot(function (snap) {
      var box = document.getElementById("threadMessages");
      if (!box) return;
      box.innerHTML = snap.docs.map(function (d) {
        var m = d.data();
        var mine = m.senderId === selfId;
        return '<div class="msg-bubble ' + (mine ? "mine" : "theirs") + '">' + escapeHtml(m.text) + '</div>';
      }).join("");
      box.scrollTop = box.scrollHeight;
    });
    var sendBtn = document.getElementById("msgSendBtn");
    var input = document.getElementById("msgInput");
    function send() {
      var text = (input.value || "").trim();
      if (!text) return;
      input.value = "";
      dbNs.collection("messages/" + convoId + "/items").add({ senderId: selfId, text: text, createdAt: Date.now() });
      dbNs.doc("messages/" + convoId).update({ lastMessageAt: Date.now(), lastMessageText: text });
      notify(otherId, "message", { snippet: text });
    }
    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); send(); } });
  }

  function openThreadWith(otherId, otherName) {
    if (!dbNs || !selfId || !otherId || otherId === selfId) return;
    var convoId = convoIdFor(selfId, otherId);
    var convoRef = dbNs.doc("messages/" + convoId);
    convoRef.get().then(function (snap) {
      if (!snap.exists) {
        var participantNames = {};
        participantNames[selfId] = (lastProfileData && lastProfileData.name) || meName || "";
        participantNames[otherId] = otherName || "";
        return convoRef.set({
          participantIds: [selfId, otherId], participantNames: participantNames,
          lastMessageAt: Date.now(), lastMessageText: ""
        });
      }
    }).then(function () {
      loadThread(convoId, otherId, otherName);
    });
  }

  var threadViewInit = document.getElementById("threadView");
  if (threadViewInit) threadViewInit.innerHTML = '<div class="messages-empty">' + escapeHtml(t("pickConversation")) + '</div>';

  var newConvoBtn = document.getElementById("newConvoBtn");
  if (newConvoBtn) {
    newConvoBtn.addEventListener("click", function () {
      var sel = document.getElementById("newConvoSelect");
      var id = sel.value;
      if (!id) return;
      var name = sel.options[sel.selectedIndex].textContent;
      openThreadWith(id, name);
    });
  }

  // ---------- form ----------
  function buildForm(existing) {
    lastProfileData = existing;
    renderSideProfile();
    var area = document.getElementById("formArea");
    var sectorOptions = SECTORS.map(function (s) {
      return '<option value="' + s + '"' + (existing && existing.sector === s ? " selected" : "") + '>' + escapeHtml(sectorLabel(s)) + '</option>';
    }).join("");
    var countryOptions = COUNTRIES.map(function (c) {
      return '<option value="' + c + '"' + (existing && existing.country === c ? " selected" : "") + '>' + escapeHtml(countryLabel(c)) + '</option>';
    }).join("");
    var langs = (existing && existing.languages) || [];
    function checked(code) { return langs.indexOf(code) !== -1 ? "checked" : ""; }

    area.innerHTML =
      '<form id="profileForm">' +
        '<div class="field full"><label>' + escapeHtml(t("photoLabel")) + '</label>' +
          '<div class="photo-field"><div class="photo-preview" id="photoPreview"></div>' +
          '<div class="photo-actions"><button type="button" id="photoBtn"></button>' +
          '<button type="button" class="link" id="photoRm">' + escapeHtml(t("photoRemove")) + '</button>' +
          '<span class="hint">' + escapeHtml(t("photoHint")) + '</span>' +
          '<input type="file" id="photoFile" accept="image/*" hidden></div></div></div>' +
        '<div class="field"><label>' + escapeHtml(t("fieldName")) + '</label>' +
          '<input type="text" id="pName" required value="' + escapeHtml(existing ? existing.name : "") + '"></div>' +
        '<div class="field"><label>' + escapeHtml(t("fieldTitle")) + '</label>' +
          '<input type="text" id="pTitle" value="' + escapeHtml(existing ? existing.title : "") + '" placeholder="' + escapeHtml(t("fieldTitlePh")) + '"></div>' +
        '<div class="field"><label>' + escapeHtml(t("fieldCity")) + '</label>' +
          '<input type="text" id="pCity" value="' + escapeHtml(existing ? existing.city : "") + '"></div>' +
        '<div class="field"><label>' + escapeHtml(t("fieldCountry")) + '</label>' +
          '<select id="pCountry"><option value="">—</option>' + countryOptions + '</select></div>' +
        '<div class="field"><label>' + escapeHtml(t("fieldSector")) + '</label>' +
          '<select id="pSector"><option value="">—</option>' + sectorOptions + '</select></div>' +
        '<div class="field"><label>' + escapeHtml(t("fieldLangs")) + '</label>' +
          '<div class="checks">' +
            '<label><input type="checkbox" value="fr" ' + checked("fr") + '> Français</label>' +
            '<label><input type="checkbox" value="de" ' + checked("de") + '> Deutsch</label>' +
            '<label><input type="checkbox" value="en" ' + checked("en") + '> English</label>' +
          '</div></div>' +
        '<div class="field full"><label>' + escapeHtml(t("fieldSkills")) + '</label>' +
          '<input type="text" id="pSkills" value="' + escapeHtml(existing ? (existing.skills || []).join(", ") : "") + '" placeholder="' + escapeHtml(t("fieldSkillsPh")) + '">' +
        '</div>' +
        '<div class="field full"><label>' + escapeHtml(t("fieldLooking")) + '</label>' +
          '<div class="hint">' + escapeHtml(t("fieldLookingHint")) + '</div>' +
          '<textarea id="pLooking">' + escapeHtml(existing ? existing.lookingFor : "") + '</textarea></div>' +
        '<div class="field full"><label>' + escapeHtml(t("fieldOffering")) + '</label>' +
          '<div class="hint">' + escapeHtml(t("fieldOfferingHint")) + '</div>' +
          '<textarea id="pOffering">' + escapeHtml(existing ? existing.offering : "") + '</textarea></div>' +
        '<div class="field full"><label>' + escapeHtml(t("fieldAbout")) + '</label>' +
          '<textarea id="pBio">' + escapeHtml(existing ? existing.bio : "") + '</textarea></div>' +
        '<div class="field full"><label>' + escapeHtml(t("fieldContact")) + '</label>' +
          '<input type="text" id="pContact" value="' + escapeHtml(existing ? existing.contact : "") + '"></div>' +
        (existing ? '<div class="field full danger-zone"><p>' + escapeHtml(t("deleteBody")) + '</p><button type="button" class="btn btn-danger btn-small" id="delProfile">' + escapeHtml(t("deleteTitle")) + '</button></div>' : '') +
        '<div class="form-actions">' +
          '<button type="submit" class="btn btn-primary">' + escapeHtml(t("saveBtn")) + '</button>' +
          '<span class="save-msg" id="saveMsg"></span>' +
        '</div>' +
      '</form>';

    pendingPhoto = (existing && existing.photo) || "";
    var dp = document.getElementById("delProfile"); if (dp) dp.addEventListener("click", deleteMyProfile);
    var wi0 = document.querySelector('#whoBox img'); if (wi0 && pendingPhoto) wi0.src = pendingPhoto;
    paintPhotoPreview();
    document.getElementById("photoBtn").addEventListener("click", function () { document.getElementById("photoFile").click(); });
    document.getElementById("photoRm").addEventListener("click", function () { pendingPhoto = ""; paintPhotoPreview(); });
    document.getElementById("photoFile").addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      resizePhoto(f).then(function (d) { pendingPhoto = d; paintPhotoPreview(); }).catch(function () {});
    });
    if (existing) {
      var sel = area.querySelector("#pCountry"); if (sel) sel.value = existing.country || "";
      var sel2 = area.querySelector("#pSector"); if (sel2) sel2.value = existing.sector || "";
    }

    document.getElementById("profileForm").addEventListener("submit", function (e) {
      e.preventDefault();
      saveProfile();
    });
  }

  function saveProfile() {
    if (!dbNs || !selfId) return;
    var langs = Array.prototype.slice.call(document.querySelectorAll('#profileForm input[type="checkbox"]:checked')).map(function (c) { return c.value; });
    var skills = (document.getElementById("pSkills").value || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    var data = {
      name: document.getElementById("pName").value.trim(),
      title: document.getElementById("pTitle").value.trim(),
      city: document.getElementById("pCity").value.trim(),
      country: document.getElementById("pCountry").value,
      sector: document.getElementById("pSector").value,
      languages: langs,
      skills: skills,
      lookingFor: document.getElementById("pLooking").value.trim(),
      offering: document.getElementById("pOffering").value.trim(),
      bio: document.getElementById("pBio").value.trim(),
      contact: document.getElementById("pContact").value.trim(),
      photo: pendingPhoto,
      createdAt: Date.now()
    };
    var ref = dbNs.collection("profiles").doc(selfId);
    ref.get().then(function (snap) {
      if (snap.exists) {
        var existing = snap.data();
        data.createdAt = existing.createdAt || Date.now();
      }
      return ref.set(data);
    }).then(function () {
      lastProfileData = data;
      renderSideProfile();
      var wi = document.querySelector('#whoBox img'); if (wi && data.photo) wi.src = data.photo;
      var msg = document.getElementById("saveMsg");
      if (msg) msg.textContent = t("saved");
    }).catch(function (err) {
      var msg = document.getElementById("saveMsg");
      if (msg) msg.textContent = t("errorPrefix") + err.message;
    });
  }

  // ---------- boot ----------
  async function init() {
    var hasClaudeNs = typeof window.claude !== "undefined" && typeof window.claude.use === "function";
    if (!hasClaudeNs) {
      document.getElementById("dirBody").innerHTML =
        '<div class="empty-state"><h3>' + escapeHtml(t("offlineTitle")) + '</h3><p>' + escapeHtml(t("offlineBody")) + '</p></div>';
      document.getElementById("formArea").innerHTML =
        '<div class="gate-msg">' + escapeHtml(t("connectToCreate")) + '</div>';
      return;
    }

    window.__stage = "début";
    window.__stage = "connexion user";
    userNs = await window.claude.use("user");
    window.__stage = "connexion db";
    dbNs = await window.claude.use("db");
    window.__stage = "db ok, lecture du profil";

    var whoBox = document.getElementById("whoBox");
    if (userNs) {
      var me = await userNs.me();
      meName = me.name || "";
      whoBox.innerHTML =
        '<img src="' + me.avatarUrl + '" alt="">' +
        '<span>' + escapeHtml(t("greeting")) + escapeHtml(me.name || t("greetingFallback")) + '</span>';
      selfId = await userNs.id();
      window.__stage = "id ok";
      try {
        if (typeof userNs.can === "function" && (await userNs.can("data.write")) === false) {
          var rb = document.getElementById("roleBanner");
          rb.textContent = T("Ton accès est en lecture ou commentaire seulement : tu ne peux pas enregistrer de profil, publier ni écrire. Demande à Nancy de te passer en « Contributeur » dans le menu Partager.", "Dein Zugang ist nur Lesen oder Kommentieren: Du kannst kein Profil speichern, nichts posten und keine Nachrichten schreiben. Bitte Nancy, dich im Teilen-Menü auf „Mitwirkender“ zu setzen.", "Your access is read or comment only: you cannot save a profile, post or send messages. Ask Nancy to set you as “Contributor” in the Share menu.");
          rb.hidden = false;
        }
      } catch (e) {}
      document.getElementById("menuName").textContent = me.name || "";
    }

    if (!dbNs) {
      document.getElementById("dirBody").innerHTML =
        '<div class="empty-state"><h3>' + escapeHtml(t("dirUnavailableTitle")) + '</h3><p>' + escapeHtml(t("dirUnavailableBody")) + '</p></div>';
      document.getElementById("formArea").innerHTML =
        '<div class="gate-msg">' + escapeHtml(t("profileUnavailable")) + '</div>';
      return;
    }

    function dbg() {} // diagnostic retiré
    function applyProfiles(snap) {
      var raw = snap.docs.length;
      window.__got = true;
      allProfiles = snap.docs.map(function (d) {
        var data = d.data(); if (data) { data = Object.assign({}, data); data.__id = d.id; } return data;
      }).filter(function (d) { return d && d.name; });
      dbg("Diagnostic : " + raw + " document(s) reçu(s), " + allProfiles.length + " valide(s), moi = " + (selfId || "inconnu"));
      renderDirectory();
      renderNewConvoOptions();
      renderFeed();
      renderNetwork();
      renderNotifs();
    }
    window.__stage = "abonnement profils envoyé";
    var profQuery = dbNs.collection("profiles").orderBy("createdAt", "desc").limit(300);
    profQuery.onSnapshot(applyProfiles, function (err) {
      document.getElementById("dirBody").innerHTML =
        '<div class="empty-state"><h3>Erreur</h3><p>' + escapeHtml(err.message) + '</p></div>';
    });
    // Fallback: if the live listener is silent, read once now and then every 15 s.
    function pullProfiles() {
      try { profQuery.get().then(applyProfiles).catch(function (e) { dbg("Diagnostic : erreur de lecture : " + (e && e.message || e)); }); } catch (e) { dbg("Diagnostic : exception : " + e.message); }
    }
    pullProfiles();
    setInterval(pullProfiles, 15000);

    if (selfId) {
      var ownRef = dbNs.collection("profiles").doc(selfId);
      ownRef.get().then(function (snap) {
        buildForm(snap.exists ? snap.data() : null);
      }).catch(function () {
        buildForm(null);
      });
    } else {
      document.getElementById("formArea").innerHTML =
        '<div class="gate-msg">' + escapeHtml(t("connectToCreate")) + '</div>';
    }

    dbNs.collection("posts").orderBy("createdAt", "desc").limit(100).onSnapshot(function (snap) {
      allPosts = snap.docs.map(function (d) { var x = d.data(); if (x) { x = Object.assign({}, x); x.__id = d.id; } return x; }).filter(Boolean);
      renderFeed();
    });
    dbNs.collection("likes").limit(2000).onSnapshot(function (snap) {
      allLikes = snap.docs.map(function (d) { return d.data(); }).filter(Boolean); renderFeed();
    }, function () {});
    dbNs.collection("comments").orderBy("createdAt", "asc").limit(1000).onSnapshot(function (snap) {
      allComments = snap.docs.map(function (d) { return d.data(); }).filter(Boolean); renderFeed();
    }, function () {});

    if (selfId) {
      dbNs.collection("notifications").where("toId", "==", selfId).onSnapshot(function (snap) {
        myNotifs = snap.docs.map(function (d) { var x = d.data(); if (x) { x = Object.assign({}, x); x.__id = d.id; } return x; }).filter(Boolean)
          .sort(function (a, b) { return b.createdAt - a.createdAt; }).slice(0, 100);
        renderNotifs();
      }, function () {});
    }

    if (selfId) {
      dbNs.collection("connections").where("participantIds", "array-contains", selfId).onSnapshot(function (snap) {
        myConns = snap.docs.map(function (d) { return d.data(); }).filter(Boolean);
        renderNetwork();
      }, function () {});
    }

    if (selfId) {
      dbNs.collection("messages").where("participantIds", "array-contains", selfId)
        .orderBy("lastMessageAt", "desc").limit(50).onSnapshot(function (snap) {
          myThreads = snap.docs.map(function (d) { var data = Object.assign({}, d.data()); data.__id = d.id; return data; });
          renderThreadList();
        }, function () { /* messages unavailable in this view */ });
    } else {
      document.getElementById("threadList").innerHTML =
        '<div class="messages-empty">' + escapeHtml(t("connectToCreate")) + '</div>';
    }
  }

  init();
})();
</script>
</body>
</html>
