<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NANE — Le réseau professionnel des talents afrodescendants francophones et germanophones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #21184B;
    --ink-soft: #342A6E;
    --paper: #FFFFFF;
    --paper-dim: #F3F0E8; /* ivoire */
    --brass: #C6A15B; /* doré */
    --brass-bright: #A5843F;
    --wine: #6E2430;
    --line: #E3DDCD;
    --text-on-ink: #FFFFFF;
    --text-on-ink-dim: rgba(255,255,255,0.72);
    --text-on-paper: #211B33;
    --text-on-paper-dim: #6A6380;
    --radius-s: 4px;
    --radius-m: 10px;
    --serif: 'Sora', 'Montserrat', -apple-system, sans-serif;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper-dim);
    color: var(--text-on-paper);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  img, svg { max-width: 100%; display: block; }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 28px; }

  /* ---------- Header ---------- */
  header.site {
    position: sticky; top: 0; z-index: 40;
    top: env(safe-area-inset-top, 0px);
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .nav-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px;
  }
  .brand {
    font-family: var(--serif); font-weight: 600; font-size: 22px;
    letter-spacing: 0.01em; color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .brand .mark { color: var(--brass-bright); }
  .toast-err { display:none; position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:200; max-width:min(92vw,520px); background:#6E2430; color:#fff; padding:12px 18px; border-radius:10px; font-size:14px; box-shadow:0 6px 24px rgba(0,0,0,.25); }
  .notice-box { background: rgba(198,161,91,0.18); border: 1px solid var(--brass); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin: 0 0 16px; }
  .logo-full { height: 30px; margin-right: 10px; width: auto; aspect-ratio: 1156 / 296; flex: none; display: block; }
  .logo-full.logo-foot { height: 32px; }
  .brand { color: #0F0F12; }
  .wordmark { font-family: 'Montserrat', var(--sans); font-weight: 500; letter-spacing: 0.38em; font-size: 0.8em; color: #0F0F12; }
  .lockup-tag { font-family: 'Montserrat', var(--sans); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-on-paper-dim); margin-top: 10px; }
  nav.links { display: flex; align-items: center; gap: 24px; }
  nav.links button.navlink { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px !important; }
  .nav-right { display: flex; align-items: center; gap: 14px; }
  .nav-icons { display: flex; align-items: center; gap: 10px; }
  .icon-wrap { position: relative; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--text-on-paper); display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
  .icon-btn:hover, .icon-btn.active { border-color: var(--ink); color: var(--ink); }
  .search-pop { position: absolute; right: 0; top: calc(100% + 10px); width: min(92vw, 420px); background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 28px rgba(33,24,75,0.16); padding: 10px; z-index: 55; }
  .search-field { position: relative; }
  .search-field > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-on-paper-dim); pointer-events: none; }
  .search-field input { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 10px 12px 10px 38px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper-dim); }
  .search-field input:focus { outline: 2px solid var(--ink); background: #fff; }
  .search-pop .search-results { position: static; min-width: 0; border: none; box-shadow: none; margin-top: 8px; border-radius: 0; }
  .search-wrap { position: relative; flex: 0 1 300px; min-width: 0; }
  .search-wrap > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-on-paper-dim); pointer-events: none; }
  .search-wrap input { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 10px 12px 10px 38px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper-dim); }
  .search-wrap input:focus { outline: 2px solid var(--ink); background: #fff; }
  .search-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; min-width: 300px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(33,24,75,0.16); z-index: 50; overflow: hidden; }
  .sr-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; background: none; border: none; text-align: left; font: inherit; cursor: pointer; }
  .sr-item:hover { background: var(--paper-dim); }
  .sr-item .pc-avatar { width: 34px; height: 34px; font-size: 13px; }
  .sr-name { font-size: 14px; font-weight: 600; }
  .sr-sub { font-size: 12px; color: var(--text-on-paper-dim); }
  .sr-all { justify-content: center; color: var(--ink); font-size: 13px; font-weight: 600; border-top: 1px solid var(--line); }
  .sr-empty { padding: 14px; font-size: 13px; color: var(--text-on-paper-dim); }
  .who-wrap { position: relative; }
  .who { background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 999px; }
  .who:hover { background: var(--paper-dim); }
  .who::after { content: "▾"; font-size: 11px; }
  .user-menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 230px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(33,24,75,0.16); z-index: 50; overflow: hidden; }
  .user-menu button { display: block; width: 100%; text-align: left; background: none; border: none; font: inherit; font-size: 14px; padding: 12px 16px; cursor: pointer; color: var(--text-on-paper); }
  .user-menu button:hover { background: var(--paper-dim); }
  .um-head { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sp-stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
  .sp-stats div { padding: 12px 8px; text-align: center; font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-on-paper-dim); }
  .sp-stats div + div { border-left: 1px solid var(--line); }
  .sp-stats b { display: block; font-family: var(--serif); font-weight: 500; font-size: 22px; letter-spacing: 0; color: var(--ink); margin-bottom: 2px; }
  .pf-bar { background: linear-gradient(120deg, var(--ink), var(--ink-soft)); color: var(--text-on-ink-dim); font-size: 14px; padding: 14px 0; }
  .pf-bar button { background: none; border: none; color: var(--text-on-ink-dim); font: inherit; cursor: pointer; padding: 0; }
  .pf-bar button:hover { color: #fff; text-decoration: underline; }
  .pf-bar b { color: #fff; font-weight: 500; }
  .pf-head { display: flex; align-items: center; gap: 28px; padding: 40px 0 32px; flex-wrap: wrap; }
  .pf-head .pc-avatar { width: 112px; height: 112px; font-size: 38px; }
  .pf-name { font-family: var(--serif); font-weight: 500; font-size: 42px; line-height: 1.1; color: var(--ink); margin: 0 0 6px; }
  .pf-title { font-size: 19px; color: var(--text-on-paper-dim); }
  .pf-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 22px 0; margin-bottom: 36px; }
  .pf-lab { font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-on-paper-dim); margin-bottom: 6px; }
  .pf-val { font-size: 16px; color: var(--text-on-paper); }
  .pf-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 48px; align-items: start; padding-bottom: 80px; }
  .pf-sec { margin-bottom: 34px; }
  .pf-sec h2 { font-family: ui-monospace, Menlo, monospace; font-weight: 400; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-bright); margin: 0 0 12px; display: flex; align-items: center; gap: 12px; }
  .pf-sec h2::before { content: ""; width: 34px; border-top: 1px solid var(--brass-bright); }
  .pf-sec p { font-size: 17px; line-height: 1.6; margin: 0; white-space: pre-line; }
  .pf-empty { color: var(--text-on-paper-dim); font-style: italic; }
  .pf-aside { position: sticky; top: 90px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m); padding: 22px; }
  .pf-aside p { font-size: 15px; color: var(--text-on-paper-dim); margin: 0 0 16px; }
  .pf-aside .btn { width: 100%; margin-bottom: 10px; }
  @media (max-width: 860px) { .pf-layout { grid-template-columns: 1fr; gap: 12px; } .pf-info { grid-template-columns: 1fr; } .pf-aside { position: static; } .pf-name { font-size: 32px; } }
  .um-btn { display: flex !important; align-items: center; gap: 12px; }
  .um-btn svg { color: var(--text-on-paper-dim); flex: none; }
  .um-btn:hover svg { color: var(--ink); }
  .um-sub { font-size: 12px; color: var(--text-on-paper-dim); margin-top: 2px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .um-sep { border-top: 1px solid var(--line); }
  .st-hero { background: linear-gradient(120deg, var(--ink), var(--ink-soft)); color: var(--text-on-ink); padding: 48px 0 40px; }
  .st-hero .rc-eyebrow { color: var(--brass); }
  .st-hero h1 { font-family: var(--serif); font-weight: 500; font-size: 38px; margin: 8px 0 8px; }
  .st-hero p { margin: 0; color: var(--text-on-ink-dim); max-width: 60ch; }
  .st-body { padding: 32px 0 80px; display: grid; gap: 18px; }
  .st-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m); padding: 22px; }
  .st-card h2 { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 0 0 4px; color: var(--ink); }
  .st-card .sub { font-size: 13px; color: var(--text-on-paper-dim); margin: 0 0 14px; }
  .um-btn[hidden], .icon-btn[hidden] { display: none; }
  .ad-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .ad-tile { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m); padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; }
  .ad-tile b { font-family: var(--serif); font-weight: 500; font-size: 34px; color: var(--ink); line-height: 1.1; }
  .ad-tile span { font-size: 13px; color: var(--ink); font-weight: 600; }
  .ad-tile i { font-style: normal; font-size: 12px; color: var(--text-on-paper-dim); }
  .ad-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
  .ad-days { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 8px; }
  .ad-day { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .ad-day .col { width: 100%; max-width: 28px; background: var(--brass); border-radius: 4px 4px 0 0; min-height: 2px; }
  .ad-day .col.zero { background: var(--line); }
  .ad-day em { font-style: normal; font-size: 11px; color: var(--ink); margin-bottom: 3px; font-weight: 600; }
  .ad-day small { font-size: 10px; color: var(--text-on-paper-dim); margin-top: 6px; white-space: nowrap; }
  .ad-bar { display: grid; grid-template-columns: minmax(90px, 1.1fr) 2fr auto; gap: 10px; align-items: center; font-size: 13px; margin: 8px 0; }
  .ad-bar .track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .ad-bar .track span { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
  .ad-bar b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .ad-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .ad-row:first-of-type { border-top: 0; }
  .ad-row .ad-when { margin-left: auto; font-size: 12px; color: var(--text-on-paper-dim); white-space: nowrap; }
  .ad-foot { font-size: 12px; color: var(--text-on-paper-dim); margin: 0; }
  @media (max-width: 560px) { .ad-day small { font-size: 9px; } .ad-bar { grid-template-columns: 1fr auto; } .ad-bar .track { grid-column: 1 / -1; order: 3; } }
  .st-id { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .st-id .pc-avatar { width: 64px; height: 64px; font-size: 22px; }
  .st-id .st-who { flex: 1; min-width: 180px; }
  .st-name { font-family: var(--serif); font-size: 22px; color: var(--ink); }
  .st-bar { height: 8px; border-radius: 999px; background: var(--paper-dim); overflow: hidden; margin: 10px 0 14px; }
  .st-bar > span { display: block; height: 100%; background: var(--brass); border-radius: 999px; transition: width .3s; }
  .st-pct { float: right; font-weight: 600; color: var(--ink); }
  .st-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
  .st-list li { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 4px 0; }
  .st-list li .ck { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
  .st-list li.done { color: var(--text-on-paper-dim); }
  .st-list li.done .ck { background: var(--brass-bright); border-color: var(--brass-bright); }
  .st-list li:not(.done) { cursor: pointer; }
  .st-list li:not(.done):hover { color: var(--ink); text-decoration: underline; }
  .st-langs { display: flex; gap: 10px; flex-wrap: wrap; }
  .st-langs button { display: inline-flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 14px; cursor: pointer; }
  .st-langs button.active { border-color: var(--ink); font-weight: 600; color: var(--ink); }
  .st-soon { font-size: 13px; color: var(--text-on-paper-dim); margin: 0; }
  @media (max-width: 640px) { .st-list { grid-template-columns: 1fr; } }
  .um-name { font-weight: 600; color: var(--ink); }
  nav.links button.navlink {
    background: none; border: none; color: var(--text-on-paper-dim);
    font-size: 15px; padding: 6px 0; border-bottom: 2px solid transparent;
  }
  nav.links button.navlink:hover { color: var(--text-on-paper); }
  nav.links button.navlink.active { color: var(--ink); border-bottom-color: var(--ink); }
  .lang-toggle {
    display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden;
  }
  .lang-toggle button {
    background: none; border: none; color: var(--text-on-paper-dim);
    font-size: 13px; padding: 6px 13px;
  }
  .lang-toggle button.active { background: var(--ink); color: var(--text-on-ink); font-weight: 600; }
  .lang-menu { position: relative; }
  .lang-btn { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 999px; color: var(--text-on-paper-dim); font: inherit; font-size: 13px; font-weight: 600; padding: 6px 11px; cursor: pointer; }
  .lang-btn:hover { border-color: var(--ink); color: var(--ink); }
  .flag { width: 20px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.14); flex: none; display: inline-block; vertical-align: -2px; }
  .lang-opt { display: inline-flex; align-items: center; gap: 10px; }
  .lang-toggle .flag { margin-right: 6px; }
  .lang-list { position: absolute; right: 0; top: calc(100% + 8px); min-width: 140px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(33,24,75,.14); padding: 6px; z-index: 60; }
  .lang-list button { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: none; text-align: left; font: inherit; font-size: 14px; color: var(--text-on-paper); padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .lang-list button:hover { background: var(--paper-dim); }
  .lang-list button.active { font-weight: 600; color: var(--ink); }
  .lang-list button.active::after { content: "\2713"; color: var(--brass-bright); }
  .who {
    display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-on-paper-dim);
  }
  .who img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 24px; border-radius: var(--radius-s); border: 1px solid transparent;
    font-size: 15px; font-weight: 600; font-family: var(--sans);
  }
  .btn-primary { background: var(--ink); color: var(--text-on-ink); }
  .btn-primary:hover { background: var(--ink-soft); }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--text-on-paper); }
  .btn-ghost:hover { border-color: var(--ink); }
  .btn-wine { background: var(--wine); color: var(--text-on-ink); }
  .btn-wine:hover { background: #7E2A37; }
  .btn-small { padding: 9px 16px; font-size: 13px; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  /* ---------- Hero ---------- */
  section.hero { padding: 88px 0 72px; position: relative; overflow: hidden; }
  /* Video d'accueil : bande pleine largeur au-dessus du bandeau, sans texte dessus */
  .video-wide { position: relative; background: #1D1642; line-height: 0; overflow: hidden; }
  .video-wide[hidden] { display: none; }
  .video-wide video { display: block; width: 100%; height: min(56.25vw, 88vh); object-fit: contain; object-position: 50% 50%; transform-origin: 50% 50%; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent 100%); transform: scale(var(--vz, 1)); background: #1D1642; }
  .video-tint { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(33,24,75,.10) 0%, rgba(33,24,75,.10) 70%, rgba(33,24,75,.45) 100%); }
  .video-ctrls { position: absolute; z-index: 2; left: 24px; bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap; line-height: normal; }
  @media (max-width: 767px) { .video-wide video { height: min(78vh, 177.78vw); object-fit: cover; -webkit-mask-image: none; mask-image: none; } .video-ctrls { left: 14px; bottom: 14px; } }
  .teaser-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(15,10,40,.95); display: flex; align-items: center; justify-content: center; padding: 56px 16px 16px; }
  .teaser-overlay[hidden] { display: none; }
  .teaser-overlay video { width: auto; height: 100%; max-width: 100%; object-fit: contain; background: #000; border-radius: 8px; }
  .teaser-close { position: absolute; top: 14px; right: 16px; font: inherit; font-size: 14px; color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.6); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  .vid-btn { font: inherit; font-size: 13px; color: #fff; background: rgba(33,24,75,.78); border: 1px solid rgba(255,255,255,.55); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .vid-btn:hover { background: rgba(33,24,75,.96); border-color: #fff; }
  .hero-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 40px; align-items: center; }
  .hero h1 {
    font-family: var(--serif); font-weight: 500; font-size: 56px; line-height: 1.07;
    margin: 0 0 24px; letter-spacing: -0.01em; color: var(--ink); text-wrap: balance;
  }
  .hero p.lead {
    font-size: 19px; color: var(--text-on-paper-dim); max-width: 56ch; margin: 0 0 18px;
  }
  .tagline { font-family: var(--serif); font-size: 22px; color: var(--ink); margin: 0 0 34px; }
  .hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; }
  .network-art { width: 100%; height: auto; }

  /* ---------- Value props ---------- */
  section.values { background: var(--paper-dim); color: var(--text-on-paper); padding: 72px 0; }
  .values h2 { font-family: var(--serif); font-weight: 500; font-size: 32px; margin: 0 0 40px; max-width: 30ch; color: var(--ink); }
  .value-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .value-card h3 { font-size: 18px; margin: 0 0 10px; font-weight: 600; }
  .value-card p { font-size: 15px; color: var(--text-on-paper-dim); margin: 0; }

    <!-- A PROPOS -->
  <section data-view="aboutus">
    <section class="mission">
      <div class="wrap wrap-narrow">
        <h2 class="i18n" data-fr="À propos de NANE" data-de="Über NANE" data-en="About NANE"></h2>
        <h3 class="i18n" data-fr="Notre mission" data-de="Unsere Mission" data-en="Our mission"></h3>
        <p class="i18n mission-lead" data-fr="Nous croyons que chaque talent mérite d’être vu, reconnu et d’accéder aux opportunités qui lui correspondent." data-de="Wir glauben, dass jedes Talent es verdient, gesehen und anerkannt zu werden und Zugang zu den Chancen zu erhalten, die zu ihm passen." data-en="We believe every talent deserves to be seen, recognised and given access to the opportunities that suit them."></p>
        <p class="i18n" data-fr="NANE a pour mission de renforcer la visibilité des professionnels afrodescendants, de favoriser les rencontres et de créer des passerelles entre les talents, les secteurs et les frontières." data-de="NANE hat die Mission, die Sichtbarkeit von Fachkräften afrikanischer Abstammung zu stärken, Begegnungen zu fördern und Brücken zwischen Talenten, Branchen und Grenzen zu bauen." data-en="NANE’s mission is to strengthen the visibility of professionals of African descent, foster encounters and build bridges between talents, sectors and borders."></p>
        <p class="i18n" data-fr="Notre réseau est ouvert à toutes celles et ceux qui partagent cette ambition : construire un environnement professionnel plus inclusif, où les compétences sont valorisées, les idées circulent et les connexions ouvrent de nouvelles perspectives." data-de="Unser Netzwerk steht allen offen, die dieses Ziel teilen: ein inklusiveres Arbeitsumfeld zu schaffen, in dem Kompetenzen wertgeschätzt werden, Ideen zirkulieren und Verbindungen neue Perspektiven eröffnen." data-en="Our network is open to everyone who shares this ambition: building a more inclusive professional environment, where skills are valued, ideas circulate and connections open up new perspectives."></p>
        <div class="hero-ctas" style="margin-top:24px">
          <button class="btn btn-primary i18n" data-view-target="signup" data-fr="S'inscrire" data-de="Registrieren" data-en="Sign up"></button>
          <button class="btn btn-ghost i18n" data-view-target="about" data-fr="Retour à l'accueil" data-de="Zur Startseite" data-en="Back to home"></button>
        </div>
      </div>
    </section>
  </section>

    <!-- FAQ -->
  <section data-view="faq">
    <section class="mission">
      <div class="wrap wrap-narrow">
        <h2 class="i18n" data-fr="Questions fréquentes" data-de="Häufige Fragen" data-en="Frequently asked questions"></h2>
        <details class="faq-item"><summary class="i18n" data-fr="Qu&#x27;est-ce que NANE ?" data-de="Was ist NANE?" data-en="What is NANE?"></summary><p class="i18n" data-fr="NANE est un réseau professionnel qui met en lumière les talents afrodescendants en Europe, favorise les connexions et crée des opportunités." data-de="NANE ist ein berufliches Netzwerk, das Talente afrikanischer Abstammung in Europa sichtbar macht, Kontakte fördert und Chancen schafft." data-en="NANE is a professional network that puts the spotlight on talent of African descent in Europe, fosters connections and creates opportunities."></p></details>
        <details class="faq-item"><summary class="i18n" data-fr="Qui peut s&#x27;inscrire ?" data-de="Wer kann sich anmelden?" data-en="Who can join?"></summary><p class="i18n" data-fr="NANE est réservé aux personnes majeures (18 ans et plus) qui l&#x27;utilisent à des fins professionnelles. Le réseau est ouvert à toutes celles et ceux qui partagent son ambition : construire un environnement professionnel plus inclusif." data-de="NANE steht nur volljährigen Personen (ab 18 Jahren) offen, die es beruflich nutzen. Das Netzwerk steht allen offen, die sein Ziel teilen: ein inklusiveres Arbeitsumfeld zu schaffen." data-en="NANE is only for adults (18 and over) who use it for professional purposes. The network is open to everyone who shares its ambition: building a more inclusive professional environment."></p></details>
        <details class="faq-item"><summary class="i18n" data-fr="Dans quels pays et quelles langues ?" data-de="In welchen Ländern und Sprachen?" data-en="Which countries and languages?"></summary><p class="i18n" data-fr="Le prototype cible la France, l&#x27;Allemagne, la Suisse, la Belgique et le Luxembourg. Le site est disponible en français, en allemand et en anglais." data-de="Der Prototyp richtet sich an Frankreich, Deutschland, die Schweiz, Belgien und Luxemburg. Die Website gibt es auf Französisch, Deutsch und Englisch." data-en="The prototype targets France, Germany, Switzerland, Belgium and Luxembourg. The site is available in French, German and English."></p></details>
        <details class="faq-item"><summary class="i18n" data-fr="L&#x27;inscription est-elle gratuite ?" data-de="Ist die Anmeldung kostenlos?" data-en="Is signing up free?"></summary><p class="i18n" data-fr="Oui, l&#x27;inscription est gratuite dans la version de test." data-de="Ja, die Anmeldung ist in der Testversion kostenlos." data-en="Yes, signing up is free in the test version."></p></details>
        <details class="faq-item"><summary class="i18n" data-fr="Quelles données demandez-vous ?" data-de="Welche Daten erfragen Sie?" data-en="What data do you ask for?"></summary><p class="i18n" data-fr="Uniquement des informations professionnelles. Aucun champ ne porte sur l&#x27;origine ethnique ou la couleur de peau. Les informations de votre profil sont visibles par les membres du réseau." data-de="Nur berufliche Angaben. Kein Feld fragt nach ethnischer Herkunft oder Hautfarbe. Die Angaben in Ihrem Profil sind für Mitglieder des Netzwerks sichtbar." data-en="Only professional information. No field asks about ethnic origin or skin colour. Your profile information is visible to members of the network."></p></details>
        <details class="faq-item"><summary class="i18n" data-fr="Mes messages sont-ils privés ?" data-de="Sind meine Nachrichten privat?" data-en="Are my messages private?"></summary><p class="i18n" data-fr="Pas dans la version de test : les messages ne sont pas privés. N&#x27;y partagez aucune information confidentielle." data-de="In der Testversion nicht: Nachrichten sind nicht privat. Teilen Sie hier keine vertraulichen Informationen." data-en="Not in the test version: messages are not private. Do not share confidential information here."></p></details>
        <details class="faq-item"><summary class="i18n" data-fr="Comment supprimer mon profil ?" data-de="Wie lösche ich mein Profil?" data-en="How do I delete my profile?"></summary><p class="i18n" data-fr="À tout moment depuis « Mon profil ». La suppression efface votre profil, vos publications, commentaires, mentions J&#x27;aime, connexions et messages." data-de="Jederzeit unter „Mein Profil“. Die Löschung entfernt Ihr Profil, Ihre Beiträge, Kommentare, Likes, Verbindungen und Nachrichten." data-en="At any time from “My profile”. Deletion removes your profile, posts, comments, likes, connections and messages."></p></details>
        <details class="faq-item"><summary class="i18n" data-fr="Comment signaler un contenu ?" data-de="Wie melde ich einen Inhalt?" data-en="How do I report content?"></summary><p class="i18n" data-fr="Chaque profil et chaque publication a un lien « Signaler ». Les signalements sont lus par l&#x27;équipe, qui répond en principe sous 7 jours. La personne signalée n&#x27;est pas informée de qui a fait le signalement." data-de="Jedes Profil und jeder Beitrag hat einen Link „Melden“. Meldungen werden vom Team gelesen, das in der Regel innerhalb von 7 Tagen antwortet. Die gemeldete Person erfährt nicht, wer die Meldung gemacht hat." data-en="Every profile and post has a “Report” link. Reports are read by the team, who normally reply within 7 days. The reported person is not told who made the report."></p></details>
        <details class="faq-item"><summary class="i18n" data-fr="NANE vérifie-t-elle les profils ?" data-de="Prüft NANE die Profile?" data-en="Does NANE verify profiles?"></summary><p class="i18n" data-fr="Non. NANE ne vérifie ni l&#x27;identité, ni les qualifications, ni les déclarations des membres, et les badges ne sont pas une garantie. Soyez prudent·e : rencontrez-vous dans des lieux publics et n&#x27;envoyez jamais d&#x27;argent à une personne que vous ne connaissez pas." data-de="Nein. NANE prüft weder Identität noch Qualifikationen oder Angaben der Mitglieder, und Badges sind keine Garantie. Seien Sie vorsichtig: Treffen Sie sich an öffentlichen Orten und senden Sie Personen, die Sie nicht kennen, niemals Geld." data-en="No. NANE does not check members&#x27; identity, qualifications or statements, and badges are not a guarantee. Be careful: meet in public places and never send money to someone you do not know."></p></details>
        <p class="faq-more i18n" data-fr="Une autre question ? Passez par la page Contact." data-de="Noch eine Frage? Nutzen Sie die Kontaktseite." data-en="Another question? Use the Contact page."></p>
        <div class="hero-ctas" style="margin-top:18px">
          <button class="btn btn-primary i18n" data-view-target="contact" data-fr="Nous contacter" data-de="Kontakt aufnehmen" data-en="Contact us"></button>
        </div>
      </div>
    </section>
  </section>

  // ---------- network (connections) ----------
  var myConns = [];
  function pairId(a, b) { return [a, b].sort().join("_"); }

    for (var i = 0; i < allProfiles.length; i++) if (allProfiles[i].__id === id) return allProfiles[i];
    return null;
  }
  function connFor(id) {
    for (var i = 0; i < myConns.length; i++) if (myConns[i].participantIds.indexOf(id) !== -1) return myConns[i];
    return null;
  }
  function connState(id) {
    var c = connFor(id);
    if (!c) return "none";
    if (c.status === "accepted") return "connected";
    return c.requesterId === selfId ? "sent" : "received";
  }
  function connAct(id, act) {
    if (!dbNs || !selfId || !id) return Promise.resolve();
    var ref = dbNs.collection("connections").doc(pairId(selfId, id));
    var fail = function (e) { toastErr(e); throw e; };
    if (act === "invite") { notify(id, "invite"); return ref.set({ participantIds: [selfId, id], requesterId: selfId, status: "pending", createdAt: Date.now() }).catch(fail); }
    if (act === "accept") { notify(id, "accepted"); return ref.update({ status: "accepted", acceptedAt: Date.now() }).catch(fail); }
    return ref.delete().catch(fail);

  // ---- Video d'accueil -------------------------------------------------
  // Chemins relatifs a index.html. Les boucles sont muettes ; le teaser complet s'ouvre au clic, avec le son.
  var NANE_VIDEO = {
    loopDesktop: "assets/video/nane-loop-desktop.mp4",       // boucle horizontale 1920 x 1080
    loopMobile: "assets/video/nane-loop-mobile.mp4",         // boucle verticale 1080 x 1920
    posterDesktop: "assets/video/nane-loop-poster.jpg",
    posterMobile: "",                                        // optionnel : sinon l'image horizontale sert aussi sur mobile
    teaser: "assets/video/nane-teaser-fr.mp4"                // teaser complet (lecteur avec commandes)
  };
  (function () {
    var sec = document.getElementById("videoWide");
    var vid = document.getElementById("wideVideo");
    var bPause = document.getElementById("wPause");
    var bTeaser = document.getElementById("wTeaser");
    var ov = document.getElementById("teaserOverlay");
    var tv = document.getElementById("teaserVideo");
    var tClose = document.getElementById("teaserClose");
    if (!sec || !vid || !(NANE_VIDEO.loopDesktop || NANE_VIDEO.loopMobile)) return;
    var mq = window.matchMedia("(max-width: 767px)");
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var userPaused = reduce;      // l'utilisateur (ou le reglage systeme) a demande l'arret
    var current = "";
    // Met a jour le texte d'un bouton dans les 3 langues (applyLang relit ces attributs)
    function label(btn, fr, de, en) {
      btn.setAttribute("data-fr", fr); btn.setAttribute("data-de", de); btn.setAttribute("data-en", en);
      btn.textContent = T(fr, de, en);
    }
    function pauseLabel(paused) {
      if (paused) label(bPause, "Lire la vidéo", "Video abspielen", "Play video");
      else label(bPause, "Mettre la vidéo en pause", "Video pausieren", "Pause video");
    }
    // Choisit la boucle selon la taille d'ecran, et la rechoisit si l'ecran change (rotation, redimensionnement)
    function pick() {
      var mobile = mq.matches;
      var src = mobile ? (NANE_VIDEO.loopMobile || NANE_VIDEO.loopDesktop) : (NANE_VIDEO.loopDesktop || NANE_VIDEO.loopMobile);
      var poster = mobile ? (NANE_VIDEO.posterMobile || NANE_VIDEO.posterDesktop) : (NANE_VIDEO.posterDesktop || NANE_VIDEO.posterMobile);
      if (src === current) return;
      current = src;
      if (poster) vid.poster = poster;
      vid.src = src;
      if (!userPaused) {
        var pr = vid.play();
        if (pr && pr.catch) pr.catch(function () { userPaused = true; pauseLabel(true); });
      }
    }
    // Zoom de la constellation (+20 % sur ordinateur), limite pour ne jamais couper les portraits
    function fitZoom() {
      if (mq.matches || !vid.clientWidth) { vid.style.setProperty("--vz", "1"); return; }
      var bw = vid.clientWidth, bh = vid.clientHeight;
      var frameH = Math.max(bh, bw * 9 / 16);          // hauteur de l'image apres recadrage "cover"
      var visible = bh / frameH;                       // part de la hauteur de l'image visible
      // v76 : constellation agrandie. Elle occupe ~67 % de la hauteur de l'image ; on la porte a ~92 % de la hauteur visible, plafonne a x1.4
      var shown = Math.min(bh, bw * 9 / 16);           // hauteur reelle de l'image affichee (mode "contain")
      var z = Math.max(1, Math.min(1.4, (0.92 * bh) / (0.67 * shown)));
      vid.style.setProperty("--vz", z.toFixed(3));
    }
    window.addEventListener("resize", fitZoom);
    pick();
    sec.hidden = false;
    fitZoom();
    pauseLabel(userPaused);
    if (mq.addEventListener) mq.addEventListener("change", pick); else if (mq.addListener) mq.addListener(pick);
    bPause.addEventListener("click", function () {
      if (vid.paused) { userPaused = false; vid.play(); pauseLabel(false); }
      else { userPaused = true; vid.pause(); pauseLabel(true); }
    });
    // Teaser complet : lecteur avec commandes, son active au clic, video entiere (contain)
    if (!NANE_VIDEO.teaser) { bTeaser.hidden = true; return; }
    var wasPlaying = false;
    function openTeaser() {
      wasPlaying = !vid.paused; vid.pause();
      if (!tv.getAttribute("src")) tv.src = NANE_VIDEO.teaser;
      ov.hidden = false;
      tv.currentTime = 0; tv.muted = false;
      var pr = tv.play(); if (pr && pr.catch) pr.catch(function () {});
      tClose.focus();
    }
    function closeTeaser() {
      tv.pause(); ov.hidden = true;
      if (wasPlaying && !userPaused) vid.play().catch(function () {});
      bTeaser.focus();
    }
    bTeaser.addEventListener("click", openTeaser);
    tClose.addEventListener("click", closeTeaser);
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !ov.hidden) closeTeaser(); });
  })();

  function deleteMyProfile() {
    if (!dbNs || !selfId) return;
    var db0 = document.getElementById("delProfile");
    if (db0 && db0.getAttribute("data-arm") !== "1") { db0.setAttribute("data-arm", "1"); db0.textContent = t("deleteConfirm"); return; }
    var msgEl = document.getElementById("saveMsg");
    if (msgEl) msgEl.textContent = T("Suppression en cours…", "Löschen läuft…", "Deleting…");
    // delete every document of a query
    function delWhere(coll, field, op, val) {
      return dbNs.collection(coll).where(field, op, val).get().then(function (snap) {
        return Promise.all(snap.docs.map(function (d) { return dbNs.collection(coll).doc(d.id).delete(); })).then(function () { return snap.docs.map(function (d) { return d.id; }); });
      });
    }
    // my posts, with their likes and comments
    var postsDone = delWhere("posts", "authorId", "==", selfId).then(function (postIds) {
      return Promise.all(postIds.map(function (pid) {
        return Promise.all([delWhere("likes", "postId", "==", pid), delWhere("comments", "postId", "==", pid)]);
      }));
    });
    // my own likes, comments, connections and notifications (sent and received)
    var others = Promise.all([
      delWhere("likes", "userId", "==", selfId),
      delWhere("comments", "authorId", "==", selfId),
      delWhere("connections", "participantIds", "array-contains", selfId),
      delWhere("notifications", "fromId", "==", selfId),
      delWhere("notifications", "toId", "==", selfId),
      // adhesions aux Circles, participations et invitations aux evenements, preferences d'invitation
      delWhere("circle_members", "userId", "==", selfId),
      delWhere("event_participants", "userId", "==", selfId),
      delWhere("event_invites", "fromId", "==", selfId),
      delWhere("event_invites", "toId", "==", selfId),
      // la preference n'existe pas toujours : on la supprime seulement si elle existe, et une vraie erreur remonte
      dbNs.collection("event_prefs").doc(selfId).get().then(function (d) { return d && d.exists ? dbNs.collection("event_prefs").doc(selfId).delete() : null; })
    ]);
    // my messages; a conversation with no message left is removed
    var convos = dbNs.collection("messages").where("participantIds", "array-contains", selfId).get().then(function (snap) {
      return Promise.all(snap.docs.map(function (c) {
        var path = "messages/" + c.id + "/items";
        return delWhere(path, "senderId", "==", selfId).then(function () {
          return dbNs.collection(path).limit(1).get();
        }).then(function (rest) {
          if (rest.docs.length === 0) return dbNs.collection("messages").doc(c.id).delete();
        });
      }));
    });
    Promise.all([postsDone, others, convos]).then(function () {
      return dbNs.collection("profiles").doc(selfId).delete();
    }).then(function () {
      pendingPhoto = ""; buildForm(null);
      var m = document.getElementById("saveMsg"); if (m) m.textContent = t("deleted");
    }).catch(function (err) {
      var m = document.getElementById("saveMsg"); if (m) m.textContent = t("errorPrefix") + ((err && err.message) || "");
    });
  }

  function resizeImage(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var k = Math.min(1, maxSide / Math.max(img.width, img.height)), q = quality, out = "";
        for (var tries = 0; tries < 5; tries++) {
          var c = document.createElement("canvas");
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL("image/jpeg", q);
          if (out.length < 170000) break;
          q = Math.max(0.5, q - 0.1); k = k * 0.85;
        }
        URL.revokeObjectURL(url);
        out.length < 200000 ? resolve(out) : reject(new Error("too big"));
      };
      img.onerror = function () { reject(new Error("image")); };
      img.src = url;
    });
  }

  function renderThreadList() {
    var list = document.getElementById("threadList");

      list.innerHTML = '<div class="messages-empty">' + escapeHtml(t("noConversations")) + '</div>';

  function loadThread(convoId, otherId, otherName) {
    if (!dbNs) return;
    if (currentThreadUnsub) { currentThreadUnsub(); currentThreadUnsub = null; }
    document.querySelectorAll(".thread-item").forEach(function (el) {
      el.classList.toggle("active", el.getAttribute("data-convo") === convoId);
    });
    var view = document.getElementById("threadView");
    view.innerHTML =
      '<div class="thread-header">' + escapeHtml(otherName || "") + '</div>' +
      '<div class="thread-messages" id="threadMessages"></div>' +
      '<div class="save-msg" id="msgErr" style="padding:0 20px"></div>' +
      '<div class="thread-input-row"><input type="text" id="msgInput" placeholder="' + escapeHtml(t("messagePlaceholder")) + '">' +
      '<button class="btn btn-primary btn-small" id="msgSendBtn">' + escapeHtml(t("sendBtn")) + '</button></div>';
    currentThreadUnsub = dbNs.collection("messages/" + convoId + "/items").orderBy("createdAt", "desc").limit(300).onSnapshot(function (snap) {
      var box = document.getElementById("threadMessages");
      if (!box) return;
      // newest 300 messages, shown oldest to newest
      box.innerHTML = snap.docs.slice().reverse().map(function (d) {
        var m = d.data();
        var mine = m.senderId === selfId;
        return '<div class="msg-bubble ' + (mine ? "mine" : "theirs") + '">' + escapeHtml(m.text) + '</div>';
      }).join("");
      box.scrollTop = box.scrollHeight;
    });
    var sendBtn = document.getElementById("msgSendBtn");
    var input = document.getElementById("msgInput");
    var sending = false;
    function send() {
      var text = (input.value || "").trim();
      if (!text || sending) return;
      sending = true; sendBtn.disabled = true;
      var errBox = document.getElementById("msgErr"); if (errBox) errBox.textContent = "";
      var now = Date.now();
      // The field is only cleared once the message is really saved.
      Promise.all([
        dbNs.collection("messages/" + convoId + "/items").add({ senderId: selfId, text: text, createdAt: now }),
        dbNs.doc("messages/" + convoId).update({ lastMessageAt: now, lastMessageText: text })
      ]).then(function () {
        input.value = "";
        notify(otherId, "message", { snippet: text });
      }).catch(function (err) {
        var b = document.getElementById("msgErr");
        if (b) b.textContent = T("Message non envoyé : ", "Nachricht nicht gesendet: ", "Message not sent: ") + ((err && err.message) || "");
      }).then(function () { sending = false; sendBtn.disabled = false; });
    }
    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); send(); } });
  }

  function openThreadWith(otherId, otherName) {
    if (!dbNs || !selfId || !otherId || otherId === selfId) return;
    var convoId = convoIdFor(selfId, otherId);
    var convoRef = dbNs.doc("messages/" + convoId);
    convoRef.get().then(function (snap) {
      if (!snap.exists) {
        var participantNames = {};
        participantNames[selfId] = (lastProfileData && lastProfileData.name) || meName || "";
        participantNames[otherId] = otherName || "";
        return convoRef.set({
          participantIds: [selfId, otherId], participantNames: participantNames,
          lastMessageAt: Date.now(), lastMessageText: ""
        });
      }
    }).then(function () {
      loadThread(convoId, otherId, otherName);
    });
  }

      if (f.size > 700 * 1024) { document.getElementById("evAttInfo").textContent = T("PDF trop lourd (700 Ko maximum).", "PDF zu groß (max. 700 KB).", "PDF too large (700 KB max)."); ev.target.value = ""; return; }
      var r = new FileReader();
      r.onload = function () { evPdfData = String(r.result); evPdfName = f.name.slice(0, 60); attInfo(); };
      r.readAsDataURL(f); ev.target.value = "";
    });
    document.getElementById("evSubmit").addEventListener("click", function () {
      var title = document.getElementById("evTitle").value.trim(), date = document.getElementById("evDate").value,
        place = document.getElementById("evPlace").value.trim(), msg = document.getElementById("evMsg");
      if (!title || !date || !place) { msg.textContent = T("Titre, date et lieu sont obligatoires.", "Titel, Datum und Ort sind Pflicht.", "Title, date and place are required."); return; }
      var ctry = document.getElementById("evCountry").value, cty = document.getElementById("evCity").value.trim();
      if (ctry !== "online" && !cty) { msg.textContent = T("Indiquez la ville.", "Bitte Stadt angeben.", "Please enter the city."); return; }
      if (document.getElementById("evTkType").value === "paid" && !(Number(document.getElementById("evPrice").value) > 0 && Number(document.getElementById("evQty").value) >= 1)) { msg.textContent = T("Indiquez un prix et un nombre de places.", "Bitte Preis und Anzahl Plätze angeben.", "Please enter a price and a number of places."); return; }
      var doc = {
        title: title, date: date, time: document.getElementById("evTime").value, endDate: document.getElementById("evEndDate").value, endTime: document.getElementById("evEndTime").value, place: place,
        cat: document.getElementById("evCat").value, country: ctry, city: ctry === "online" ? "" : ((cityNames(cty) || [cty])[0]),
        price: document.getElementById("evTkType").value === "paid" ? Number(document.getElementById("evPrice").value) || 0 : 0,
        qty: Number(document.getElementById("evQty").value) || 0, refundDays: Number(document.getElementById("evRefund").value) || 0, plus: document.getElementById("evPlus").checked,
        description: document.getElementById("evDesc").value.trim(),
        image: evImgData, pdf: evPdfData, pdfName: evPdfName, video: document.getElementById("evVideo").value.trim(),
        authorId: evMe(), authorName: (typeof myName === "function" && myName()) || T("Membre", "Mitglied", "Member"),
        badges: ((typeof lastProfileData !== "undefined" && lastProfileData && lastProfileData.badges) || []).slice(0, 4), createdAt: Date.now()
      };
      function done() {
        evImgData = ""; evPdfData = ""; evPdfName = ""; attInfo();
        document.getElementById("evTkType").value = "free"; if (window.tkPrev) window.tkPrev();
        ["evTitle", "evDate", "evTime", "evEndDate", "evEndTime", "evPlace", "evDesc", "evVideo", "evCity"].forEach(function (k) { document.getElementById(k).value = ""; });
        msg.textContent = T("Événement publié.", "Veranstaltung veröffentlicht.", "Event published.");
        evTab = "up"; renderEvents(); setTimeout(function () { evCloseForm(); document.getElementById("evMsg").textContent = ""; }, 700);
      }
      if (!dbNs || !selfId) { doc.id = "local-" + Date.now(); evList.push(doc); done(); return; }
      var toFeed = document.getElementById("evPostFeed").checked;
      dbNs.collection("events").add(doc).then(function (ref) { if (toFeed) { doc.id = ref.id; evShareProfile(doc); } done(); }).catch(toastErr);
    });
  })();
  function evLoadDb() {
    function applyEv(snap) {
      evList = snap.docs.map(function (d) { var x = d.data(); if (!x) return null; x = Object.assign({}, x); x.id = d.id; return x; }).filter(function (x) { return x && x.title && x.date; });
      renderEvents();
    }
    function applyPt(snap) {
      evParts = snap.docs.map(function (d) { var x = d.data(); if (!x) return null; x = Object.assign({}, x); x.id = d.id; return x; }).filter(Boolean);
      renderEvents();
    }
    function applyInv(snap) { evInvites = snap.docs.map(function (d) { var x = d.data(); return x ? Object.assign({}, x) : null; }).filter(Boolean); renderEvents(); }
    function applyPrefs(snap) { evPrefs = {}; snap.docs.forEach(function (d) { var x = d.data(); if (x) evPrefs[d.id] = { noInvites: !!x.noInvites }; }); renderEvents(); }
    var qi = dbNs.collection("event_invites").limit(3000), qpr = dbNs.collection("event_prefs").limit(3000);
    qi.onSnapshot(applyInv, function () {}); qpr.onSnapshot(applyPrefs, function () {});
    try { qi.get().then(applyInv).catch(function () {}); qpr.get().then(applyPrefs).catch(function () {}); } catch (e) { }
    var qe = dbNs.collection("events").limit(300), qp = dbNs.collection("event_participants").limit(3000);
    qe.onSnapshot(applyEv, function () {}); qp.onSnapshot(applyPt, function () {});
    try { qe.get().then(applyEv).catch(function () {}); qp.get().then(applyPt).catch(function () {}); } catch (e) { }
  }

  // ---------- boot ----------
  var OFFLINE = false;
  async function init() {
    var hasClaudeNs = typeof window.claude !== "undefined" && typeof window.claude.use === "function";
    if (!hasClaudeNs) {
      OFFLINE = true;
      var dbar = document.getElementById("demoBar"); if (dbar) dbar.hidden = false;
      try {
        var iso0 = function (n) { var d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); };
        evList.push({ id: "demo-tk1", title: "Afterwork NANE Berlin (demo)", date: iso0(25), time: "19:00", place: "Berlin", country: "Allemagne", city: "Berlin", cat: "networking", price: 12, qty: 40, refundDays: 7, plus: false, authorId: "demo-org", authorName: "NANE (demo)", badges: [], createdAt: Date.now() },
          { id: "demo-tk2", get title() { return T("Atelier CV et entretien (démo)", "Lebenslauf- und Bewerbungsworkshop (Demo)", "CV and interview workshop (demo)"); }, date: iso0(4), time: "18:30", place: "Lausanne", country: "Suisse", city: "Lausanne", cat: "atelier", price: 20, qty: 25, refundDays: 7, plus: true, authorId: "demo-org", authorName: "NANE (demo)", badges: [], createdAt: Date.now() });
        renderEvents();
      } catch (e) { }
      try { renderFeed(); } catch (e) { }
      document.getElementById("dirBody").innerHTML =
        '<div class="empty-state"><h3>' + escapeHtml(t("offlineTitle")) + '</h3><p>' + escapeHtml(t("offlineBody")) + '</p></div>';
      document.getElementById("formArea").innerHTML =
        '<div class="gate-msg">' + escapeHtml(t("connectToCreate")) + '</div>';
      return;
    }

    window.__stage = "début";
    window.__stage = "connexion user";
    userNs = await window.claude.use("user");
    window.__stage = "connexion db";
    dbNs = await window.claude.use("db");
    window.__stage = "db ok, lecture du profil";

    var whoBox = document.getElementById("whoBox");
    if (userNs) {
      var me = await userNs.me();
      meName = me.name || "";
      whoBox.innerHTML =
        '<img src="' + me.avatarUrl + '" alt="">' +
        '<span>' + escapeHtml(t("greeting")) + escapeHtml(me.name || t("greetingFallback")) + '</span>';
      selfId = await userNs.id();
      window.__stage = "id ok";
      updateAdminMenu();
      try {
        if (typeof userNs.can === "function" && (await userNs.can("data.write")) === false) {
          var rb = document.getElementById("roleBanner");
          rb.textContent = T("Votre accès est en lecture ou commentaire seulement : vous ne pouvez pas enregistrer de profil, publier ni écrire. Demandez à Nancy de vous passer en « Contributeur » dans le menu Partager.", "Ihr Zugang ist nur Lesen oder Kommentieren: Sie können kein Profil speichern, nichts posten und keine Nachrichten schreiben. Bitten Sie Nancy, Sie im Teilen-Menü auf „Mitwirkender“ zu setzen.", "Your access is read or comment only: you cannot save a profile, post or send messages. Ask Nancy to set you as “Contributor” in the Share menu.");
          rb.hidden = false;
        }
      } catch (e) {}
      document.getElementById("menuName").textContent = me.name || "";
    }

    if (!dbNs) {
      document.getElementById("dirBody").innerHTML =
        '<div class="empty-state"><h3>' + escapeHtml(t("dirUnavailableTitle")) + '</h3><p>' + escapeHtml(t("dirUnavailableBody")) + '</p></div>';
      document.getElementById("formArea").innerHTML =
        '<div class="gate-msg">' + escapeHtml(t("profileUnavailable")) + '</div>';
      return;
    }

    function dbg() {} // diagnostic retiré
    function applyProfiles(snap) {
      var raw = snap.docs.length;
      window.__got = true;
      allProfiles = snap.docs.map(function (d) {
        var data = d.data(); if (data) { data = Object.assign({}, data); data.__id = d.id; } return data;
      }).filter(function (d) { return d && d.name; });
      dbg("Diagnostic : " + raw + " document(s) reçu(s), " + allProfiles.length + " valide(s), moi = " + (selfId || "inconnu"));
      renderDirectory();
      renderNewConvoOptions();
      renderFeed();
      renderNetwork();
      renderNotifs();
      refreshAdmin();
    }
    window.__stage = "abonnement profils envoyé";
    var profQuery = dbNs.collection("profiles").orderBy("createdAt", "desc").limit(300);
    profQuery.onSnapshot(applyProfiles, function (err) {
      document.getElementById("dirBody").innerHTML =
        '<div class="empty-state"><h3>Erreur</h3><p>' + escapeHtml(err.message) + '</p></div>';
    });
    // Fallback: if the live listener is silent, read once now and then every 15 s.
    function pullProfiles() {
      try { profQuery.get().then(applyProfiles).catch(function (e) { dbg("Diagnostic : erreur de lecture : " + (e && e.message || e)); }); } catch (e) { dbg("Diagnostic : exception : " + e.message); }
    }
    pullProfiles();
    setInterval(pullProfiles, 15000);

    if (selfId) {
      var ownRef = dbNs.collection("profiles").doc(selfId);
      ownRef.get().then(function (snap) {
        buildForm(snap.exists ? snap.data() : null);
      }).catch(function () {
        buildForm(null);
      });
    } else {
      document.getElementById("formArea").innerHTML =
        '<div class="gate-msg">' + escapeHtml(t("connectToCreate")) + '</div>';
    }

    dbNs.collection("posts").orderBy("createdAt", "desc").limit(100).onSnapshot(function (snap) {
      allPosts = snap.docs.map(function (d) { var x = d.data(); if (x) { x = Object.assign({}, x); x.__id = d.id; } return x; }).filter(Boolean);
      renderFeed(); refreshAdmin();
    });
    dbNs.collection("likes").limit(2000).onSnapshot(function (snap) {
      allLikes = snap.docs.map(function (d) { return d.data(); }).filter(Boolean); renderFeed(); refreshAdmin();
    }, function () {});
    if (selfId) circLoadDb();
    if (selfId) evLoadDb();
    if (selfId) orgLoadDb();
    dbNs.collection("comments").orderBy("createdAt", "asc").limit(1000).onSnapshot(function (snap) {
      allComments = snap.docs.map(function (d) { return d.data(); }).filter(Boolean); renderFeed(); refreshAdmin();
    }, function () {});

    if (selfId) {
      dbNs.collection("notifications").where("toId", "==", selfId).onSnapshot(function (snap) {
        myNotifs = snap.docs.map(function (d) { var x = d.data(); if (x) { x = Object.assign({}, x); x.__id = d.id; } return x; }).filter(Boolean)
          .sort(function (a, b) { return b.createdAt - a.createdAt; }).slice(0, 100);
        renderNotifs();
      }, function () {});
    }

    if (selfId) {
      dbNs.collection("connections").where("participantIds", "array-contains", selfId).onSnapshot(function (snap) {
        myConns = snap.docs.map(function (d) { return d.data(); }).filter(Boolean);
        renderNetwork();
        renderSideProfile();
      }, function () {});
    }

    if (selfId) {
      dbNs.collection("messages").where("participantIds", "array-contains", selfId)
        .orderBy("lastMessageAt", "desc").limit(50).onSnapshot(function (snap) {
          myThreads = snap.docs.map(function (d) { var data = Object.assign({}, d.data()); data.__id = d.id; return data; });
          renderThreadList();
        }, function () { /* messages unavailable in this view */ });
    } else {
      document.getElementById("threadList").innerHTML =
        '<div class="messages-empty">' + escapeHtml(t("connectToCreate")) + '</div>';
    }
  }

  init();
})();
</script>
</body>
</html>
