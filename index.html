<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NANE — Le réseau professionnel des talents noirs francophones et germanophones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #21184B;
    --ink-soft: #342A6E;
    --paper: #FFFFFF;
    --paper-dim: #F3F0E8; /* ivoire */
    --brass: #C6A15B; /* doré */
    --brass-bright: #A5843F;
    --wine: #6E2430;
    --line: #E3DDCD;
    --text-on-ink: #FFFFFF;
    --text-on-ink-dim: rgba(255,255,255,0.72);
    --text-on-paper: #211B33;
    --text-on-paper-dim: #6A6380;
    --radius-s: 4px;
    --radius-m: 10px;
    --serif: 'Fraunces', serif;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper-dim);
    color: var(--text-on-paper);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  img, svg { max-width: 100%; display: block; }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 28px; }

  /* ---------- Header ---------- */
  header.site {
    position: sticky; top: 0; z-index: 40;
    top: env(safe-area-inset-top, 0px);
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .nav-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px;
  }
  .brand {
    font-family: var(--serif); font-weight: 600; font-size: 22px;
    letter-spacing: 0.01em; color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .brand .mark { color: var(--brass-bright); }
  .toast-err { display:none; position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:200; max-width:min(92vw,520px); background:#6E2430; color:#fff; padding:12px 18px; border-radius:10px; font-size:14px; box-shadow:0 6px 24px rgba(0,0,0,.25); }
  .notice-box { background: rgba(198,161,91,0.18); border: 1px solid var(--brass); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin: 0 0 16px; }
  .logo-full { height: 30px; margin-right: 10px; width: auto; aspect-ratio: 1156 / 296; flex: none; display: block; }
  .logo-full.logo-foot { height: 32px; }
  .brand { color: #0F0F12; }
  .wordmark { font-family: 'Montserrat', var(--sans); font-weight: 500; letter-spacing: 0.38em; font-size: 0.8em; color: #0F0F12; }
  .lockup-tag { font-family: 'Montserrat', var(--sans); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-on-paper-dim); margin-top: 10px; }
  nav.links { display: flex; align-items: center; gap: 24px; }
  nav.links button.navlink { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px !important; }
  .nav-right { display: flex; align-items: center; gap: 14px; }
  .nav-icons { display: flex; align-items: center; gap: 10px; }
  .icon-wrap { position: relative; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--text-on-paper); display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
  .icon-btn:hover, .icon-btn.active { border-color: var(--ink); color: var(--ink); }
  .search-pop { position: absolute; right: 0; top: calc(100% + 10px); width: min(92vw, 420px); background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 28px rgba(33,24,75,0.16); padding: 10px; z-index: 55; }
  .search-field { position: relative; }
  .search-field > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-on-paper-dim); pointer-events: none; }
  .search-field input { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 10px 12px 10px 38px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper-dim); }
  .search-field input:focus { outline: 2px solid var(--ink); background: #fff; }
  .search-pop .search-results { position: static; min-width: 0; border: none; box-shadow: none; margin-top: 8px; border-radius: 0; }
  .search-wrap { position: relative; flex: 0 1 300px; min-width: 0; }
  .search-wrap > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-on-paper-dim); pointer-events: none; }
  .search-wrap input { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 10px 12px 10px 38px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper-dim); }
  .search-wrap input:focus { outline: 2px solid var(--ink); background: #fff; }
  .search-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; min-width: 300px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(33,24,75,0.16); z-index: 50; overflow: hidden; }
  .sr-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; background: none; border: none; text-align: left; font: inherit; cursor: pointer; }
  .sr-item:hover { background: var(--paper-dim); }
  .sr-item .pc-avatar { width: 34px; height: 34px; font-size: 13px; }
  .sr-name { font-size: 14px; font-weight: 600; }
  .sr-sub { font-size: 12px; color: var(--text-on-paper-dim); }
  .sr-all { justify-content: center; color: var(--ink); font-size: 13px; font-weight: 600; border-top: 1px solid var(--line); }
  .sr-empty { padding: 14px; font-size: 13px; color: var(--text-on-paper-dim); }
  .who-wrap { position: relative; }
  .who { background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 999px; }
  .who:hover { background: var(--paper-dim); }
  .who::after { content: "▾"; font-size: 11px; }
  .user-menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 230px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(33,24,75,0.16); z-index: 50; overflow: hidden; }
  .user-menu button { display: block; width: 100%; text-align: left; background: none; border: none; font: inherit; font-size: 14px; padding: 12px 16px; cursor: pointer; color: var(--text-on-paper); }
  .user-menu button:hover { background: var(--paper-dim); }
  .um-head { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sp-stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
  .sp-stats div { padding: 12px 8px; text-align: center; font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-on-paper-dim); }
  .sp-stats div + div { border-left: 1px solid var(--line); }
  .sp-stats b { display: block; font-family: var(--serif); font-weight: 500; font-size: 22px; letter-spacing: 0; color: var(--ink); margin-bottom: 2px; }
  .pf-bar { background: linear-gradient(120deg, var(--ink), var(--ink-soft)); color: var(--text-on-ink-dim); font-size: 14px; padding: 14px 0; }
  .pf-bar button { background: none; border: none; color: var(--text-on-ink-dim); font: inherit; cursor: pointer; padding: 0; }
  .pf-bar button:hover { color: #fff; text-decoration: underline; }
  .pf-bar b { color: #fff; font-weight: 500; }
  .pf-head { display: flex; align-items: center; gap: 28px; padding: 40px 0 32px; flex-wrap: wrap; }
  .pf-head .pc-avatar { width: 112px; height: 112px; font-size: 38px; }
  .pf-name { font-family: var(--serif); font-weight: 500; font-size: 42px; line-height: 1.1; color: var(--ink); margin: 0 0 6px; }
  .pf-title { font-size: 19px; color: var(--text-on-paper-dim); }
  .pf-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 22px 0; margin-bottom: 36px; }
  .pf-lab { font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-on-paper-dim); margin-bottom: 6px; }
  .pf-val { font-size: 16px; color: var(--text-on-paper); }
  .pf-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 48px; align-items: start; padding-bottom: 80px; }
  .pf-sec { margin-bottom: 34px; }
  .pf-sec h2 { font-family: ui-monospace, Menlo, monospace; font-weight: 400; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-bright); margin: 0 0 12px; display: flex; align-items: center; gap: 12px; }
  .pf-sec h2::before { content: ""; width: 34px; border-top: 1px solid var(--brass-bright); }
  .pf-sec p { font-size: 17px; line-height: 1.6; margin: 0; white-space: pre-line; }
  .pf-empty { color: var(--text-on-paper-dim); font-style: italic; }
  .pf-aside { position: sticky; top: 90px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m); padding: 22px; }
  .pf-aside p { font-size: 15px; color: var(--text-on-paper-dim); margin: 0 0 16px; }
  .pf-aside .btn { width: 100%; margin-bottom: 10px; }
  @media (max-width: 860px) { .pf-layout { grid-template-columns: 1fr; gap: 12px; } .pf-info { grid-template-columns: 1fr; } .pf-aside { position: static; } .pf-name { font-size: 32px; } }
  .um-btn { display: flex !important; align-items: center; gap: 12px; }
  .um-btn svg { color: var(--text-on-paper-dim); flex: none; }
  .um-btn:hover svg { color: var(--ink); }
  .um-sub { font-size: 12px; color: var(--text-on-paper-dim); margin-top: 2px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .um-sep { border-top: 1px solid var(--line); }
  .st-hero { background: linear-gradient(120deg, var(--ink), var(--ink-soft)); color: var(--text-on-ink); padding: 48px 0 40px; }
  .st-hero .rc-eyebrow { color: var(--brass); }
  .st-hero h1 { font-family: var(--serif); font-weight: 500; font-size: 38px; margin: 8px 0 8px; }
  .st-hero p { margin: 0; color: var(--text-on-ink-dim); max-width: 60ch; }
  .st-body { padding: 32px 0 80px; display: grid; gap: 18px; }
  .st-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m); padding: 22px; }
  .st-card h2 { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 0 0 4px; color: var(--ink); }
  .st-card .sub { font-size: 13px; color: var(--text-on-paper-dim); margin: 0 0 14px; }
  .um-btn[hidden], .icon-btn[hidden] { display: none; }
  .ad-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .ad-tile { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m); padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; }
  .ad-tile b { font-family: var(--serif); font-weight: 500; font-size: 34px; color: var(--ink); line-height: 1.1; }
  .ad-tile span { font-size: 13px; color: var(--ink); font-weight: 600; }
  .ad-tile i { font-style: normal; font-size: 12px; color: var(--text-on-paper-dim); }
  .ad-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
  .ad-days { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 8px; }
  .ad-day { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .ad-day .col { width: 100%; max-width: 28px; background: var(--brass); border-radius: 4px 4px 0 0; min-height: 2px; }
  .ad-day .col.zero { background: var(--line); }
  .ad-day em { font-style: normal; font-size: 11px; color: var(--ink); margin-bottom: 3px; font-weight: 600; }
  .ad-day small { font-size: 10px; color: var(--text-on-paper-dim); margin-top: 6px; white-space: nowrap; }
  .ad-bar { display: grid; grid-template-columns: minmax(90px, 1.1fr) 2fr auto; gap: 10px; align-items: center; font-size: 13px; margin: 8px 0; }
  .ad-bar .track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .ad-bar .track span { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
  .ad-bar b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .ad-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .ad-row:first-of-type { border-top: 0; }
  .ad-row .ad-when { margin-left: auto; font-size: 12px; color: var(--text-on-paper-dim); white-space: nowrap; }
  .ad-foot { font-size: 12px; color: var(--text-on-paper-dim); margin: 0; }
  @media (max-width: 560px) { .ad-day small { font-size: 9px; } .ad-bar { grid-template-columns: 1fr auto; } .ad-bar .track { grid-column: 1 / -1; order: 3; } }
  .st-id { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .st-id .pc-avatar { width: 64px; height: 64px; font-size: 22px; }
  .st-id .st-who { flex: 1; min-width: 180px; }
  .st-name { font-family: var(--serif); font-size: 22px; color: var(--ink); }
  .st-bar { height: 8px; border-radius: 999px; background: var(--paper-dim); overflow: hidden; margin: 10px 0 14px; }
  .st-bar > span { display: block; height: 100%; background: var(--brass); border-radius: 999px; transition: width .3s; }
  .st-pct { float: right; font-weight: 600; color: var(--ink); }
  .st-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
  .st-list li { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 4px 0; }
  .st-list li .ck { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
  .st-list li.done { color: var(--text-on-paper-dim); }
  .st-list li.done .ck { background: var(--brass-bright); border-color: var(--brass-bright); }
  .st-list li:not(.done) { cursor: pointer; }
  .st-list li:not(.done):hover { color: var(--ink); text-decoration: underline; }
  .st-langs { display: flex; gap: 10px; flex-wrap: wrap; }
  .st-langs button { display: inline-flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 14px; cursor: pointer; }
  .st-langs button.active { border-color: var(--ink); font-weight: 600; color: var(--ink); }
  .st-soon { font-size: 13px; color: var(--text-on-paper-dim); margin: 0; }
  @media (max-width: 640px) { .st-list { grid-template-columns: 1fr; } }
  .um-name { font-weight: 600; color: var(--ink); }
  nav.links button.navlink {
    background: none; border: none; color: var(--text-on-paper-dim);
    font-size: 15px; padding: 6px 0; border-bottom: 2px solid transparent;
  }
  nav.links button.navlink:hover { color: var(--text-on-paper); }
  nav.links button.navlink.active { color: var(--ink); border-bottom-color: var(--ink); }
  .lang-toggle {
    display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden;
  }
  .lang-toggle button {
    background: none; border: none; color: var(--text-on-paper-dim);
    font-size: 13px; padding: 6px 13px;
  }
  .lang-toggle button.active { background: var(--ink); color: var(--text-on-ink); font-weight: 600; }
  .lang-menu { position: relative; }
  .lang-btn { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 999px; color: var(--text-on-paper-dim); font: inherit; font-size: 13px; font-weight: 600; padding: 6px 11px; cursor: pointer; }
  .lang-btn:hover { border-color: var(--ink); color: var(--ink); }
  .flag { width: 20px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.14); flex: none; display: inline-block; vertical-align: -2px; }
  .lang-opt { display: inline-flex; align-items: center; gap: 10px; }
  .lang-toggle .flag { margin-right: 6px; }
  .lang-list { position: absolute; right: 0; top: calc(100% + 8px); min-width: 140px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(33,24,75,.14); padding: 6px; z-index: 60; }
  .lang-list button { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: none; text-align: left; font: inherit; font-size: 14px; color: var(--text-on-paper); padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .lang-list button:hover { background: var(--paper-dim); }
  .lang-list button.active { font-weight: 600; color: var(--ink); }
  .lang-list button.active::after { content: "\2713"; color: var(--brass-bright); }
  .who {
    display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-on-paper-dim);
  }
  .who img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 24px; border-radius: var(--radius-s); border: 1px solid transparent;
    font-size: 15px; font-weight: 600; font-family: var(--sans);
  }
  .btn-primary { background: var(--ink); color: var(--text-on-ink); }
  .btn-primary:hover { background: var(--ink-soft); }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--text-on-paper); }
  .btn-ghost:hover { border-color: var(--ink); }
  .btn-wine { background: var(--wine); color: var(--text-on-ink); }
  .btn-wine:hover { background: #7E2A37; }
  .btn-small { padding: 9px 16px; font-size: 13px; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  /* ---------- Hero ---------- */
  section.hero { padding: 88px 0 72px; position: relative; overflow: hidden; }
  .hero-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 40px; align-items: center; }
  .hero h1 {
    font-family: var(--serif); font-weight: 500; font-size: 56px; line-height: 1.07;
    margin: 0 0 24px; letter-spacing: -0.01em; color: var(--ink); text-wrap: balance;
  }
  .hero p.lead {
    font-size: 19px; color: var(--text-on-paper-dim); max-width: 56ch; margin: 0 0 18px;
  }
  .tagline { font-family: var(--serif); font-size: 22px; color: var(--ink); margin: 0 0 34px; }
  .hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; }
  .network-art { width: 100%; height: auto; }

  /* ---------- Value props ---------- */
  section.values { background: var(--paper-dim); color: var(--text-on-paper); padding: 72px 0; }
  .values h2 { font-family: var(--serif); font-weight: 500; font-size: 32px; margin: 0 0 40px; max-width: 30ch; color: var(--ink); }
  .value-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .value-card h3 { font-size: 18px; margin: 0 0 10px; font-weight: 600; }
  .value-card p { font-size: 15px; color: var(--text-on-paper-dim); margin: 0; }
  .value-card { border-top: 2px solid var(--brass); padding-top: 18px; }

  .legal { padding: 56px 0 72px; background: var(--paper-dim); border-top: 1px solid var(--line); }
  .legal h2 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 0 0 14px; color: var(--ink); }
  .legal h3 { font-size: 16px; margin: 26px 0 8px; color: var(--ink); }
  .legal ul { margin: 0; padding-left: 20px; font-size: 15px; color: var(--text-on-paper-dim); }
  .legal li { margin-bottom: 6px; }
  .legal .draft { font-size: 13px; color: var(--wine); margin-top: 18px; }
  .report-link { background: none; border: none; font: inherit; font-size: 12px; color: var(--text-on-paper-dim); text-decoration: underline; cursor: pointer; padding: 0; margin-left: auto; }
  .post-top .report-link { align-self: flex-start; }
  .report-form label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  .report-form select, .report-form textarea { width: 100%; font: inherit; font-size: 14px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .report-form textarea { min-height: 80px; }
  .danger-zone { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); }
  .danger-zone p { font-size: 13px; color: var(--text-on-paper-dim); margin: 0 0 10px; }
  .btn-danger { background: #fff; color: var(--wine); border: 1px solid var(--wine); }

  .public-actions { display: none; gap: 10px; align-items: center; }
  body.public .public-actions { display: flex; }
  body.public .nav-icons, body.public nav.links, body.public .who-wrap { display: none; }
  body.public .nav-right { margin-left: auto; }
  .examples { padding: 8px 0 56px; background: var(--paper-dim); }
  .ex-label { font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-on-paper-dim); padding: 36px 0 16px; }
  .ex-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .ex-card { position: relative; display: flex; gap: 14px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m); padding: 18px; }
  .ex-card .pc-avatar { width: 52px; height: 52px; }

  /* ---------- Directory ---------- */
  section.directory { padding: 72px 0 96px; background: var(--paper-dim); }
  .dir-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }

  .dir-count { font-size: 14px; color: var(--text-on-paper-dim); margin-top: 6px; }

  .filters {
    display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 30px;
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m);
    padding: 16px;
  }
  .filters input, .filters select {
    background: #fff; border: 1px solid var(--line); color: var(--text-on-paper);

  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .profile-card {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m);
    padding: 22px; cursor: pointer; transition: border-color 0.15s ease, box-shadow 0.15s ease;

    box-shadow: 0 1px 2px rgba(33,24,75,0.05);
  }

  .pc-top { display: flex; align-items: center; gap: 12px; }
  .pc-avatar {
    width: 44px; height: 44px; border-radius: 50%; background: var(--ink);
    color: var(--text-on-ink); display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-weight: 600; font-size: 16px; flex: none;

  .pc-avatar.has-photo, .modal-avatar.has-photo { background-size: cover; background-position: center; color: transparent; font-size: 0; }
  .photo-field { display: flex; align-items: center; gap: 16px; }

  }

  /* ---------- Feed ---------- */
  .wrap-narrow { max-width: 640px; }

  /* ---------- Messages ---------- */
  .new-convo { display: flex; gap: 10px; margin-bottom: 20px; }
  .new-convo select {
    flex: 1 1 auto; background: #fff; border: 1px solid var(--line); color: var(--text-on-paper);
    border-radius: var(--radius-s); padding: 10px 12px; font-size: 14px; font-family: var(--sans);
  }
  .messages-layout {
    display: grid; grid-template-columns: 260px 1fr; gap: 18px; min-height: 420px;
    border: 1px solid var(--line); border-radius: var(--radius-m); overflow: hidden;
  }
  .thread-list { border-right: 1px solid var(--line); background: var(--paper-dim); overflow-y: auto; max-height: 520px; }
  .thread-item {
    padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; flex-direction: column; gap: 3px;
  }
  .thread-item:hover { background: rgba(33,24,75,0.04); }
  .thread-item.active { background: rgba(33,24,75,0.08); }
  .thread-item .t-name { font-weight: 600; font-size: 14px; }

  .thread-input-row { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }

    flex: 1 1 auto; border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px 13px;
    font-size: 14px; font-family: var(--sans); color: var(--text-on-paper);

  @media (max-width: 760px) {

  /* ---------- Profile form ---------- */
  section.form-section { background: var(--paper-dim); color: var(--text-on-paper); padding: 72px 0 90px; }
  .form-head { max-width: 56ch; margin-bottom: 36px; }

  .form-head p { color: var(--text-on-paper-dim); font-size: 15px; margin: 0; }

  form#profileForm { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 13px; font-weight: 600; color: var(--text-on-paper); }
  .field .hint { font-size: 12px; color: var(--text-on-paper-dim); margin-top: -2px; }
  .field input, .field select, .field textarea {
    font-family: var(--sans); font-size: 15px; padding: 11px 13px;
    border: 1px solid var(--line); border-radius: var(--radius-s); background: #fff; color: var(--text-on-paper);
  }
  .field textarea { resize: vertical; min-height: 78px; }
  .checks { display: flex; gap: 16px; flex-wrap: wrap; }
  .checks label { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 400; color: var(--text-on-paper); }
  .form-actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; margin-top: 8px; }
  .save-msg { font-size: 14px; color: #3E7A4C; }
  .gate-msg {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius-m); padding: 24px;
    font-size: 15px; color: var(--text-on-paper-dim);
  }

  @media (max-width: 760px) {
    form#profileForm { grid-template-columns: 1fr; }
  }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(33,24,75,0.45); z-index: 100;
    display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 60px 20px;
  }
  .modal {
    background: #fff; color: var(--text-on-paper); border-radius: var(--radius-m);
    max-width: 560px; width: 100%; padding: 36px; position: relative;
    box-shadow: 0 20px 60px rgba(33,24,75,0.25);
  }
  .modal-close {
    position: absolute; top: 18px; right: 18px; background: none; border: none;
    font-size: 22px; color: var(--text-on-paper-dim); line-height: 1; padding: 4px;
  }
  .modal-top { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
  .modal-avatar {
    width: 58px; height: 58px; border-radius: 50%; background: var(--ink);
    color: var(--text-on-ink); display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-weight: 600; font-size: 20px; flex: none;
  }
  .modal h3 { font-family: var(--serif); font-weight: 500; font-size: 24px; margin: 0 0 4px; color: var(--ink); }
  .modal .modal-sub { font-size: 14px; color: var(--text-on-paper-dim); }
  .modal-block { margin-top: 20px; }
  .modal-block h4 { font-size: 13px; font-weight: 600; text-transform: none; margin: 0 0 6px; color: var(--text-on-paper); }
  .modal-block p { font-size: 14px; color: var(--text-on-paper-dim); margin: 0; white-space: pre-line; }

  /* ---------- Footer ---------- */
  footer { padding: 36px 0; border-top: 1px solid var(--line); }
  footer .wrap { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
  footer { background: var(--paper-dim); }
  .foot-links { display: grid; grid-template-columns: repeat(2, auto); gap: 10px 40px; }
  .foot-links a { font-size: 14px; color: var(--text-on-paper-dim); text-decoration: none; }
  .foot-links a:hover { color: var(--ink); text-decoration: underline; }
  footer .foot-bottom { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); align-items: center; font-size: 13px; color: var(--text-on-paper-dim); }
  footer p { font-size: 13px; color: var(--text-on-paper-dim); margin: 0; }

  section[data-view] { display: none; }
  section[data-view].active { display: block; }

  @media (max-width: 860px) {
    .feed-grid { grid-template-columns: 1fr; }
    .side-card, .right-col { position: static; }
    .hero-grid { grid-template-columns: 1fr; }
    .network-art { display: none; }
    .hero h1 { font-size: 40px; }
    .value-grid { grid-template-columns: 1fr; }
    .nav-row { flex-wrap: wrap; row-gap: 8px; padding: 12px 18px 0; }
    .brand { order: 1; } .nav-right { order: 2; margin-left: auto; }
    .who span { display: none; }
    .nav-right { gap: 8px; } .nav-icons { gap: 6px; } .icon-btn { width: 36px; height: 36px; } .lang-btn #langCur { display: none; } .logo-full { height: 26px; margin-right: 0; }
    .search-pop { position: fixed; left: 12px; right: 12px; top: 58px; width: auto; }
    nav.links {
      order: 4; width: 100%; gap: 22px; justify-content: space-around; overflow-x: auto; padding: 0 0 2px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    nav.links::-webkit-scrollbar { display: none; }
    nav.links button.navlink { white-space: nowrap; flex: none; }
  }
</style>

ponsabilité en cas de faute intentionnelle ou de faute lourde, d'atteinte à la vie, au corps ou à la santé, ou lorsque la loi l'interdit, ni vos droits impératifs de consommateur·rice.</li><li><b>Garantie.</b> Si un tiers réclame quelque chose à NANE à cause d'un contenu que vous avez publié ou d'un manquement fautif de votre part à ces conditions, vous vous engagez à indemniser NANE des frais qui en résultent, dans les limites permises par la loi.</li><li><b>Fin.</b> Vous pouvez supprimer votre profil à tout moment. Nous pouvons suspendre un compte qui enfreint ces conditions.</li><li><b>Modifications.</b> Nous pouvons mettre à jour ces conditions. Nous vous demanderons d'accepter la nouvelle version avant de continuer à publier ou à échanger.</li><li><b>Droit applicable.</b> [Droit applicable et tribunaux compétents : à compléter avec une juriste.] Les protections impératives du pays où vous résidez restent applicables.</li><li><b>Preuve.</b> Nous conservons la date et la version des conditions que vous avez acceptées.</li>"
          data-de="<li><b>Wer sich anmelden kann.</b> NANE steht nur volljährigen Personen (ab 18 Jahren) offen, die es beruflich nutzen.</li><li><b>Betreiber.</b> NANE wird betrieben von [Name des Betreibers, Rechtsform, Anschrift, Kontakt-E-Mail: zu ergänzen].</li><li><b>Was NANE ist.</b> NANE ist eine Plattform, über die sich Mitglieder finden und kontaktieren können. NANE ist weder Arbeitgeber noch Personalvermittlung noch Vermittler und ist nicht Partei von Vereinbarungen zwischen Mitgliedern. Wir prüfen weder die Identität noch die Qualifikationen oder Angaben der Mitglieder. Badges sind keine Garantie.</li><li><b>Ihre Verantwortung.</b> Sie allein sind verantwortlich für die Inhalte, die Sie veröffentlichen, und für Ihren Austausch, Ihre Treffen und Vereinbarungen mit anderen Mitgliedern, online wie offline. Seien Sie vorsichtig: Treffen Sie sich an öffentlichen Orten und senden Sie Personen, die Sie nicht kennen, niemals Geld oder vertrauliche Informationen.</li><li><b>Regeln.</b> Sie verpflichten sich, die Community-Charta einzuhalten. Bei Verstößen können wir Inhalte entfernen und Konten sperren oder löschen.</li><li><b>Meldungen.</b> Wir prüfen Inhalte nicht im Voraus. Wir bearbeiten Meldungen und entfernen offensichtlich rechtswidrige Inhalte zügig, sobald wir davon Kenntnis erhalten.</li><li><b>Ihre Inhalte.</b> Ihre Inhalte gehören weiterhin Ihnen. Sie räumen NANE eine unentgeltliche, nicht ausschließliche Lizenz ein, sie auf der Plattform anzuzeigen, solange sie dort veröffentlicht sind. Sie versichern, dass Sie berechtigt sind, sie zu veröffentlichen.</li><li><b>Haftung von NANE.</b> Der Dienst wird so bereitgestellt, wie er ist. NANE haftet nicht für das Verhalten von Mitgliedern, für die von ihnen veröffentlichten Inhalte oder für die Folgen von Verbindungen, Treffen oder Vereinbarungen zwischen Mitgliedern. Soweit gesetzlich zulässig, ist die Haftung von NANE für mittelbare Schäden ausgeschlossen. Nichts in diesen Bedingungen beschränkt die Haftung bei Vorsatz oder grober Fahrlässigkeit, bei Verletzung von Leben, Körper oder Gesundheit oder wo das Gesetz es nicht erlaubt, noch Ihre zwingenden Verbraucherrechte.</li><li><b>Freistellung.</b> Macht ein Dritter wegen eines von Ihnen veröffentlichten Inhalts oder eines schuldhaften Verstoßes gegen diese Bedingungen Ansprüche gegen NANE geltend, stellen Sie NANE von den daraus entstehenden Kosten frei, soweit gesetzlich zulässig.</li><li><b>Beendigung.</b> Sie können Ihr Profil jederzeit löschen. Wir können Konten sperren, die gegen diese Bedingungen verstoßen.</li><li><b>Änderungen.</b> Wir können diese Bedingungen aktualisieren. Wir bitten Sie, die neue Fassung zu akzeptieren, bevor Sie weiter veröffentlichen oder Nachrichten austauschen.</li><li><b>Anwendbares Recht.</b> [Anwendbares Recht und Gerichtsstand: mit einer Juristin zu ergänzen.] Die zwingenden Schutzvorschriften Ihres Wohnsitzlandes bleiben anwendbar.</li><li><b>Nachweis.</b> Wir speichern Datum und Fassung der Bedingungen, die Sie akzeptiert haben.</li>"

ts, to the extent permitted by law.</li><li><b>Ending.</b> You can delete your profile at any time. We may suspend accounts that break these terms.</li><li><b>Changes.</b> We may update these terms. We will ask you to accept the new version before you continue posting or messaging.</li><li><b>Applicable law.</b> [Applicable law and competent courts: to be completed with a lawyer.] The mandatory protections of your country of residence still apply.</li><li><b>Proof.</b> We keep the date and version of the terms you accepted.</li>"></ul>

          data-de="<li>Dieses Netzwerk ist ein beruflicher Raum: Es geht um Werdegänge, Projekte und Chancen.</li><li>Respekt gegenüber jeder Person. Keine rassistischen, sexistischen, homophoben, diskriminierenden oder hasserfüllten Äußerungen.</li><li>Keine Belästigung, kein Nachhaken nach einer Absage, keine sexuellen Anspielungen.</li><li>Ein Profil = eine echte Person. Identitätsmissbrauch ist verboten.</li><li>Kein Spam, keine übermäßige Werbung, kein Betrug.</li><li>Verstoßende Inhalte können entfernt und Konten gesperrt werden."

      var q = norm(inp.value.trim());

        return norm([p.name, p.title, p.city, p.country, p.sector, (p.skills || []).join(" ")].join(" ")).indexOf(q) !== -1;

    var sBtn = document.getElementById("searchBtn"), sPop = document.getElementById("searchPop");
    function closeSearch() { sPop.hidden = true; box.hidden = true; sBtn.setAttribute("aria-expanded", "false"); }

  function connState(id) {

  function connAct(id, act) {

    var ref = dbNs.collection("connections").doc(pairId(selfId, id));
    var fail = function (e) { toastErr(e); throw e; };
    if (act === "invite") { notify(id, "invite"); return ref.set({ participantIds: [selfId, id], requesterId: selfId, status: "pending", createdAt: Date.now() }).catch(fail); }
    if (act === "accept") { notify(id, "accepted"); return ref.update({ status: "accepted", acceptedAt: Date.now() }).catch(fail); }
    return ref.delete().catch(fail);

  function safeImg(u) {

    return (s || "").replace(/[&<>"']/g, function (c) {

        URL.revokeObjectURL(url);

  function deleteMyProfile() {
    if (!dbNs || !selfId) return;
    var db0 = document.getElementById("delProfile");
    if (db0 && db0.getAttribute("data-arm") !== "1") { db0.setAttribute("data-arm", "1"); db0.textContent = t("deleteConfirm"); return; }
    var msgEl = document.getElementById("saveMsg");
    if (msgEl) msgEl.textContent = T("Suppression en cours…", "Löschen läuft…", "Deleting…");
    // delete every document of a query
    function delWhere(coll, field, op, val) {
      return dbNs.collection(coll).where(field, op, val).get().then(function (snap) {
        return Promise.all(snap.docs.map(function (d) { return dbNs.collection(coll).doc(d.id).delete(); })).then(function () { return snap.docs.map(function (d) { return d.id; }); });
      });
    }
    // my posts, with their likes and comments
    var postsDone = delWhere("posts", "authorId", "==", selfId).then(function (postIds) {
      return Promise.all(postIds.map(function (pid) {
        return Promise.all([delWhere("likes", "postId", "==", pid), delWhere("comments", "postId", "==", pid)]);
      }));
    });
    // my own likes, comments, connections and notifications (sent and received)
    var others = Promise.all([
      delWhere("likes", "userId", "==", selfId),
      delWhere("comments", "authorId", "==", selfId),
      delWhere("connections", "participantIds", "array-contains", selfId),
      delWhere("notifications", "fromId", "==", selfId),
      delWhere("notifications", "toId", "==", selfId)
    ]);
    // my messages; a conversation with no message left is removed
    var convos = dbNs.collection("messages").where("participantIds", "array-contains", selfId).get().then(function (snap) {
      return Promise.all(snap.docs.map(function (c) {
        var path = "messages/" + c.id + "/items";
        return delWhere(path, "senderId", "==", selfId).then(function () {
          return dbNs.collection(path).limit(1).get();
        }).then(function (rest) {
          if (rest.docs.length === 0) return dbNs.collection("messages").doc(c.id).delete();
        });
      }));
    });
    Promise.all([postsDone, others, convos]).then(function () {
      return dbNs.collection("profiles").doc(selfId).delete();
    }).then(function () {
      pendingPhoto = ""; buildForm(null);
      var m = document.getElementById("saveMsg"); if (m) m.textContent = t("deleted");
    }).catch(function (err) {
      var m = document.getElementById("saveMsg"); if (m) m.textContent = t("errorPrefix") + ((err && err.message) || "");
    });
  }

  function resizeImage(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var k = Math.min(1, maxSide / Math.max(img.width, img.height)), q = quality, out = "";
        for (var tries = 0; tries < 5; tries++) {
          var c = document.createElement("canvas");
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL("image/jpeg", q);
          if (out.length < 170000) break;
          q = Math.max(0.5, q - 0.1); k = k * 0.85;
        }
        URL.revokeObjectURL(url);
        out.length < 200000 ? resolve(out) : reject(new Error("too big"));
      };
      img.onerror = function () { reject(new Error("image")); };
      img.src = url;
    });
  }

      '<div class="thread-input-row"><input type="text" id="msgInput" placeholder="' + escapeHtml(t("messagePlaceholder")) + '">' +
      '<button class="btn btn-primary btn-small" id="msgSendBtn">' + escapeHtml(t("sendBtn")) + '</button></div>';
    currentThreadUnsub = dbNs.collection("messages/" + convoId + "/items").orderBy("createdAt", "desc").limit(300).onSnapshot(function (snap) {
      var box = document.getElementById("threadMessages");
      if (!box) return;
      // newest 300 messages, shown oldest to newest
      box.innerHTML = snap.docs.slice().reverse().map(function (d) {
        var m = d.data();
        var mine = m.senderId === selfId;
        return '<div class="msg-bubble ' + (mine ? "mine" : "theirs") + '">' + escapeHtml(m.text) + '</div>';
      }).join("");
      box.scrollTop = box.scrollHeight;
    });
    var sendBtn = document.getElementById("msgSendBtn");
    var input = document.getElementById("msgInput");
    var sending = false;
    function send() {
      var text = (input.value || "").trim();
      if (!text || sending || !termsOk()) return;
      sending = true; sendBtn.disabled = true;
      var errBox = document.getElementById("msgErr"); if (errBox) errBox.textContent = "";
      var now = Date.now();
      // The field is only cleared once the message is really saved.
      Promise.all([
        dbNs.collection("messages/" + convoId + "/items").add({ senderId: selfId, text: text, createdAt: now }),
        dbNs.doc("messages/" + convoId).update({ lastMessageAt: now, lastMessageText: text })
      ]).then(function () {
        input.value = "";
        notify(otherId, "message", { snippet: text });
      }).catch(function (err) {
        var b = document.getElementById("msgErr");
        if (b) b.textContent = T("Message non envoyé : ", "Nachricht nicht gesendet: ", "Message not sent: ") + ((err && err.message) || "");
      }).then(function () { sending = false; sendBtn.disabled = false; });
    }
    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); send(); } });
  }

  function openThreadWith(otherId, otherName) {
    if (!dbNs || !selfId || !otherId || otherId === selfId || !termsOk()) return;
    var convoId = convoIdFor(selfId, otherId);
    var convoRef = dbNs.doc("messages/" + convoId);
    convoRef.get().then(function (snap) {
      if (!snap.exists) {
        var participantNames = {};
        participantNames[selfId] = (lastProfileData && lastProfileData.name) || meName || "";
        participantNames[otherId] = otherName || "";
        return convoRef.set({
          participantIds: [selfId, otherId], participantNames: participantNames,
          lastMessageAt: Date.now(), lastMessageText: ""
        });
      }
    }).then(function () {
      loadThread(convoId, otherId, otherName);
    });
  }

  var threadViewInit = document.getElementById("threadView");
  if (threadViewInit) threadViewInit.innerHTML = '<div class="messages-empty">' + escapeHtml(t("pickConversation")) + '</div>';

  var newConvoBtn = document.getElementById("newConvoBtn");
  if (newConvoBtn) {
    newConvoBtn.addEventListener("click", function () {
      var sel = document.getElementById("newConvoSelect");
      var id = sel.value;
      if (!id) return;
      var name = sel.options[sel.selectedIndex].textContent;
      openThreadWith(id, name);
    });
  }

  // ---------- form ----------
  function buildForm(existing, draft) {
    lastProfileData = existing;
    var src = draft || existing;
    renderSideProfile();
    var area = document.getElementById("formArea");
    var sectorOptions = SECTORS.map(function (s) {
      return '<option value="' + s + '"' + (src && src.sector === s ? " selected" : "") + '>' + escapeHtml(sectorLabel(s)) + '</option>';
    }).join("");
    var countryOptions = COUNTRIES.map(function (c) {
      return '<option value="' + c + '"' + (src && src.country === c ? " selected" : "") + '>' + escapeHtml(countryLabel(c)) + '</option>';
    }).join("");
    var langs = (src && src.languages) || [];
    function checked(code) { return langs.indexOf(code) !== -1 ? "checked" : ""; }

    area.innerHTML =
      '<form id="profileForm">' +
        '<div class="field full"><label>' + escapeHtml(t("photoLabel")) + '</label>' +
          '<div class="photo-field"><div class="photo-preview" id="photoPreview"></div>' +
          '<div class="photo-actions"><button type="button" id="photoBtn"></button>' +
          '<button type="button" class="link" id="photoRm">' + escapeHtml(t("photoRemove")) + '</button>' +
          '<span class="hint">' + escapeHtml(t("photoHint")) + '</span>' +
          '<input type="file" id="photoFile" accept="image/*" hidden></div></div></div>' +
        '<div class="field"><label>' + escapeHtml(t("fieldName")) + '</label>' +
          '<input type="text" id="pName" required value="' + escapeHtml(src ? src.name : "") + '"></div>' +
        '<div class="field"><label>' + escapeHtml(t("fieldTitle")) + '</label>' +
          '<input type="text" id="pTitle" value="' + escapeHtml(src ? src.title : "") + '" placeholder="' + escapeHtml(t("fieldTitlePh")) + '"></div>' +
        '<div class="field"><label>' + escapeHtml(t("fieldCity")) + '</label>' +
          '<input type="text" id="pCity" value="' + escapeHtml(src ? src.city : "") + '"></div>' +
        '<div class="field"><label>' + escapeHtml(t("fieldCountry")) + '</label>' +
          '<select id="pCountry"><option value="">—</option>' + countryOptions + '</select></div>' +
        '<div class="field"><label>' + escapeHtml(t("fieldSector")) + '</label>' +
          '<select id="pSector"><option value="">—</option>' + sectorOptions + '</select></div>' +
        '<div class="field"><label>' + escapeHtml(t("fieldLangs")) + '</label>' +
          '<div class="checks">' +
            '<label><input type="checkbox" value="fr" ' + checked("fr") + '> Français</label>' +
            '<label><input type="checkbox" value="de" ' + checked("de") + '> Deutsch</label>' +
            '<label><input type="checkbox" value="en" ' + checked("en") + '> English</label>' +
          '</div></div>' +
        '<div class="field full"><label>' + escapeHtml(T("Centres d'intérêt", "Interessen", "Interests")) + '</label>' +
          chipsHtml("pInterests", INTERESTS.map(function (x) { return x[0]; }), (src && src.interests) || [], interestLabel) + '</div>' +
        '<div class="field full"><label>' + escapeHtml(t("fieldSkills")) + '</label>' +
          '<input type="text" id="pSkills" value="' + escapeHtml(src ? (src.skills || []).join(", ") : "") + '" placeholder="' + escapeHtml(t("fieldSkillsPh")) + '">' +
        '</div>' +
        '<div class="field full"><label>' + escapeHtml(t("fieldLooking")) + '</label>' +
          '<div class="hint">' + escapeHtml(t("fieldLookingHint")) + '</div>' +
          '<textarea id="pLooking">' + escapeHtml(src ? src.lookingFor : "") + '</textarea></div>' +
        '<div class="field full"><label>' + escapeHtml(t("fieldOffering")) + '</label>' +
          '<div class="hint">' + escapeHtml(t("fieldOfferingHint")) + '</div>' +
          '<textarea id="pOffering">' + escapeHtml(src ? src.offering : "") + '</textarea></div>' +
        '<div class="field full"><label>' + escapeHtml(t("fieldAbout")) + '</label>' +
          '<textarea id="pBio">' + escapeHtml(src ? src.bio : "") + '</textarea></div>' +
        '<div class="field full"><label>' + escapeHtml(T("Expériences professionnelles", "Berufserfahrung", "Work experience")) + '</label>' +
          '<div class="hint">' + escapeHtml(T("Du plus récent au plus ancien.", "Von der neuesten zur ältesten.", "Most recent first.")) + '</div>' +
          repBlock("pExps", src && src.experiences, expRow, T("Ajouter une expérience", "Erfahrung hinzufügen", "Add an experience")) + '</div>' +
        '<div class="field full"><label>' + escapeHtml(T("Formation", "Ausbildung", "Education")) + '</label>' +
          repBlock("pEdus", src && src.education, eduRow, T("Ajouter une formation", "Ausbildung hinzufügen", "Add education")) + '</div>' +
        '<div class="field full"><label>' + escapeHtml(T("Projets et portfolio", "Projekte und Portfolio", "Projects and portfolio")) + '</label>' +
          '<div class="hint">' + escapeHtml(T("Présentez 2 ou 3 réalisations marquantes : contexte, votre rôle, résultat.", "Stellen Sie 2 oder 3 Projekte vor, auf die Sie stolz sind: Kontext, Ihre Rolle, Ergebnis.", "Present 2 or 3 achievements you are proud of: context, your role, result.")) + '</div>' +
          '<textarea id="pProjects">' + escapeHtml(src ? src.projects : "") + '</textarea></div>' +
        '<div class="field full"><label>' + escapeHtml(T("Lien portfolio ou site", "Link zu Portfolio oder Website", "Portfolio or website link")) + '</label>' +
          '<input type="text" id="pPortfolio" value="' + escapeHtml(src ? src.portfolio : "") + '" placeholder="https://"></div>' +
        '<div class="field full"><label>' + escapeHtml(t("fieldContact")) + '</label>' +
          '<input type="text" id="pContact" value="' + escapeHtml(src ? src.contact : "") + '"></div>' +
        (existing ? '<div class="field full danger-zone"><p>' + escapeHtml(t("deleteBody")) + '</p><button type="button" class="btn btn-danger btn-small" id="delProfile">' + escapeHtml(t("deleteTitle")) + '</button></div>' : '') +
        '<div class="form-actions">' +
          '<button type="submit" class="btn btn-primary">' + escapeHtml(t("saveBtn")) + '</button>' +
          '<span class="save-msg" id="saveMsg"></span>' +
        '</div>' +
      '</form>';

    bindChips(document.getElementById("pInterests"));
    bindRep("pExps", expRow); bindRep("pEdus", eduRow);
    pendingPhoto = safeImg(src && src.photo);
    var dp =document.getElementById("delProfile"); if (dp) dp.addEventListener("click", deleteMyProfile);
    var wi0 = document.querySelector('#whoBox img'); if (wi0 && safeImg(pendingPhoto)) wi0.src = safeImg(pendingPhoto);
    paintPhotoPreview();
    document.getElementById("photoBtn").addEventListener("click", function () { document.getElementById("photoFile").click(); });
    document.getElementById("photoRm").addEventListener("click", function () { pendingPhoto = ""; paintPhotoPreview(); });
    document.getElementById("photoFile").addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      resizePhoto(f).then(function (d) { pendingPhoto = d; paintPhotoPreview(); }).catch(function () {});
    });
    if (src) {
      var sel = area.querySelector("#pCountry"); if (sel) sel.value = src.country || "";
      var sel2 = area.querySelector("#pSector"); if (sel2) sel2.value = src.sector || "";
    }

    document.getElementById("profileForm").addEventListener("submit", function (e) {
      e.preventDefault();
      saveProfile();
    });
  }

  // Reads what is currently typed in the form (used to keep unsaved input when the language changes).
  function readProfileForm() {
    if (!document.getElementById("profileForm")) return null;
    var langs = Array.prototype.slice.call(document.querySelectorAll('#profileForm .checks input[type="checkbox"]:checked')).map(function (c) { return c.value; });
    return {
      name: document.getElementById("pName").value, title: document.getElementById("pTitle").value,
      city: document.getElementById("pCity").value, country: document.getElementById("pCountry").value,
      sector: document.getElementById("pSector").value, languages: langs, interests: chipsValue(document.getElementById("pInterests")),
      experiences: repValue("pExps"), education: repValue("pEdus"),
      skills: (document.getElementById("pSkills").value || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean),
      lookingFor: document.getElementById("pLooking").value, offering: document.getElementById("pOffering").value,
      bio: document.getElementById("pBio").value, projects: document.getElementById("pProjects").value,
      portfolio: document.getElementById("pPortfolio").value, contact: document.getElementById("pContact").value,
      photo: pendingPhoto
    };
  }

  function saveProfile() {
    if (!dbNs || !selfId || !termsOk()) return;
    var langs = Array.prototype.slice.call(document.querySelectorAll('#profileForm .checks input[type="checkbox"]:checked')).map(function (c) { return c.value; });
    var skills = (document.getElementById("pSkills").value || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    var data = {
      name: document.getElementById("pName").value.trim(),
      title: document.getElementById("pTitle").value.trim(),
      city: document.getElementById("pCity").value.trim(),
      country: document.getElementById("pCountry").value,
      sector: document.getElementById("pSector").value,
      languages: langs,
      interests: chipsValue(document.getElementById("pInterests")),
      experiences: repValue("pExps"),
      education: repValue("pEdus"),
      skills: skills,
      lookingFor: document.getElementById("pLooking").value.trim(),
      offering: document.getElementById("pOffering").value.trim(),
      bio: document.getElementById("pBio").value.trim(),
      projects: document.getElementById("pProjects").value.trim(),
      portfolio: normalizeUrl(document.getElementById("pPortfolio").value),
      contact: document.getElementById("pContact").value.trim(),
      photo: pendingPhoto,
      createdAt: Date.now()
    };
    var ref = dbNs.collection("profiles").doc(selfId);
    ref.get().then(function (snap) {
      if (snap.exists) {
        var existing = snap.data();
        data.createdAt = existing.createdAt || Date.now();
      }
      return ref.set(data);
    }).then(function () {
      var firstSave = !lastProfileData;
      lastProfileData = data;
      renderSideProfile();
      if (firstSave) buildForm(data); // shows the "delete my profile" area right away
      var wi = document.querySelector('#whoBox img'); if (wi && safeImg(data.photo)) wi.src = safeImg(data.photo);
      var msg = document.getElementById("saveMsg");
      if (msg) msg.textContent = t("saved");
    }).catch(function (err) {
      var msg = document.getElementById("saveMsg");
      if (msg) msg.textContent = t("errorPrefix") + err.message;
    });
  }

  // ---------- boot ----------
  async function init() {
    var hasClaudeNs = typeof window.claude !== "undefined" && typeof window.claude.use === "function";
    if (!hasClaudeNs) {
      document.getElementById("dirBody").innerHTML =
        '<div class="empty-state"><h3>' + escapeHtml(t("offlineTitle")) + '</h3><p>' + escapeHtml(t("offlineBody")) + '</p></div>';
      document.getElementById("formArea").innerHTML =
        '<div class="gate-msg">' + escapeHtml(t("connectToCreate")) + '</div>';
      return;
    }

    window.__stage = "début";
    window.__stage = "connexion user";
    userNs = await window.claude.use("user");
    window.__stage = "connexion db";
    dbNs = await window.claude.use("db");
    window.__stage = "db ok, lecture du profil";

    var whoBox = document.getElementById("whoBox");
    if (userNs) {
      var me = await userNs.me();
      meName = me.name || "";
      whoBox.innerHTML =
        '<img src="' + me.avatarUrl + '" alt="">' +
        '<span>' + escapeHtml(t("greeting")) + escapeHtml(me.name || t("greetingFallback")) + '</span>';
      selfId = await userNs.id();
      window.__stage = "id ok";
      updateAdminMenu();
      try {
        if (typeof userNs.can === "function" && (await userNs.can("data.write")) === false) {
          var rb = document.getElementById("roleBanner");
          rb.textContent = T("Ton accès est en lecture ou commentaire seulement : tu ne peux pas enregistrer de profil, publier ni écrire. Demande à Nancy de te passer en « Contributeur » dans le menu Partager.", "Dein Zugang ist nur Lesen oder Kommentieren: Du kannst kein Profil speichern, nichts posten und keine Nachrichten schreiben. Bitte Nancy, dich im Teilen-Menü auf „Mitwirkender“ zu setzen.", "Your access is read or comment only: you cannot save a profile, post or send messages. Ask Nancy to set you as “Contributor” in the Share menu.");
          rb.hidden = false;
        }
      } catch (e) {}
      document.getElementById("menuName").textContent = me.name || "";
    }

    if (!dbNs) {
      document.getElementById("dirBody").innerHTML =
        '<div class="empty-state"><h3>' + escapeHtml(t("dirUnavailableTitle")) + '</h3><p>' + escapeHtml(t("dirUnavailableBody")) + '</p></div>';
      document.getElementById("formArea").innerHTML =
        '<div class="gate-msg">' + escapeHtml(t("profileUnavailable")) + '</div>';
      return;
    }

    function dbg() {} // diagnostic retiré
    function applyProfiles(snap) {
      var raw = snap.docs.length;
      window.__got = true;
      allProfiles = snap.docs.map(function (d) {
        var data = d.data(); if (data) { data = Object.assign({}, data); data.__id = d.id; } return data;
      }).filter(function (d) { return d && d.name; });
      dbg("Diagnostic : " + raw + " document(s) reçu(s), " + allProfiles.length + " valide(s), moi = " + (selfId || "inconnu"));
      renderDirectory();
      renderNewConvoOptions();
      renderFeed();
      renderNetwork();
      renderNotifs();
      refreshAdmin();
    }
    window.__stage = "abonnement profils envoyé";
    var profQuery = dbNs.collection("profiles").orderBy("createdAt", "desc").limit(300);
    profQuery.onSnapshot(applyProfiles, function (err) {
      document.getElementById("dirBody").innerHTML =
        '<div class="empty-state"><h3>Erreur</h3><p>' + escapeHtml(err.message) + '</p></div>';
    });
    // Fallback: if the live listener is silent, read once now and then every 15 s.
    function pullProfiles() {
      try { profQuery.get().then(applyProfiles).catch(function (e) { dbg("Diagnostic : erreur de lecture : " + (e && e.message || e)); }); } catch (e) { dbg("Diagnostic : exception : " + e.message); }
    }
    pullProfiles();
    setInterval(pullProfiles, 15000);

    if (selfId) {
      dbNs.collection("consents").doc(selfId).get().then(function (snap) {
        termsAccepted = snap.exists ? (snap.data() || {}).termsVersion || null : null;
      }).catch(function () {});
      var ownRef = dbNs.collection("profiles").doc(selfId);
      ownRef.get().then(function (snap) {
        buildForm(snap.exists ? snap.data() : null);
      }).catch(function () {
        buildForm(null);
      });
    } else {
      document.getElementById("formArea").innerHTML =
        '<div class="gate-msg">' + escapeHtml(t("connectToCreate")) + '</div>';
    }

    dbNs.collection("posts").orderBy("createdAt", "desc").limit(100).onSnapshot(function (snap) {
      allPosts = snap.docs.map(function (d) { var x = d.data(); if (x) { x = Object.assign({}, x); x.__id = d.id; } return x; }).filter(Boolean);
      renderFeed(); refreshAdmin();
    });
    dbNs.collection("likes").limit(2000).onSnapshot(function (snap) {
      allLikes = snap.docs.map(function (d) { return d.data(); }).filter(Boolean); renderFeed(); refreshAdmin();
    }, function () {});
    dbNs.collection("comments").orderBy("createdAt", "asc").limit(1000).onSnapshot(function (snap) {
      allComments = snap.docs.map(function (d) { return d.data(); }).filter(Boolean); renderFeed(); refreshAdmin();
    }, function () {});

    if (selfId) {
      dbNs.collection("notifications").where("toId", "==", selfId).onSnapshot(function (snap) {
        myNotifs = snap.docs.map(function (d) { var x = d.data(); if (x) { x = Object.assign({}, x); x.__id = d.id; } return x; }).filter(Boolean)
          .sort(function (a, b) { return b.createdAt - a.createdAt; }).slice(0, 100);
        renderNotifs();
      }, function () {});
    }

    if (selfId) {
      dbNs.collection("connections").where("participantIds", "array-contains", selfId).onSnapshot(function (snap) {
        myConns = snap.docs.map(function (d) { return d.data(); }).filter(Boolean);
        renderNetwork();
        renderSideProfile();
      }, function () {});
    }

    if (selfId) {
      dbNs.collection("messages").where("participantIds", "array-contains", selfId)
        .orderBy("lastMessageAt", "desc").limit(50).onSnapshot(function (snap) {
          myThreads = snap.docs.map(function (d) { var data = Object.assign({}, d.data()); data.__id = d.id; return data; });
          renderThreadList();
        }, function () { /* messages unavailable in this view */ });
    } else {
      document.getElementById("threadList").innerHTML =
        '<div class="messages-empty">' + escapeHtml(t("connectToCreate")) + '</div>';
    }
  }

  init();
})();
</script>
</body>
</html>
